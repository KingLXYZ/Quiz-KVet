<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz de Medicina Veterinária</title>
<style>
:root{
  --bg:#f2f7f5;--fg:#172b27;--card:#ffffff;--muted:#64756f;
  --accent:#087f68;--accent-fg:#ffffff;--accent-soft:#e2f3ed;
  --ok:#168653;--bad:#d64b4b;--line:#dce8e2;
  --shadow:0 18px 55px rgba(20,67,53,.10);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101a17;--fg:#edf7f2;--card:#192622;--muted:#a3b5ad;
    --accent:#49c6a1;--accent-fg:#08231b;--accent-soft:#203b32;
    --ok:#55d69a;--bad:#ff8585;--line:#30443c;
    --shadow:0 18px 55px rgba(0,0,0,.24);
  }
}
:root[data-theme="dark"]{
  --bg:#101a17;--fg:#edf7f2;--card:#192622;--muted:#a3b5ad;
  --accent:#49c6a1;--accent-fg:#08231b;--accent-soft:#203b32;
  --ok:#55d69a;--bad:#ff8585;--line:#30443c;
  --shadow:0 18px 55px rgba(0,0,0,.24);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
  padding:clamp(14px,3vw,34px);
  background:
    radial-gradient(circle at 8% 5%,rgba(8,127,104,.10),transparent 28rem),
    radial-gradient(circle at 95% 90%,rgba(72,178,139,.10),transparent 25rem),var(--bg);
  color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:3px}
.card{
  width:100%;max-width:760px;align-self:flex-start;margin:clamp(8px,3vh,30px) auto;
  padding:clamp(20px,4vw,38px);border:1px solid var(--line);border-radius:26px;
  background:var(--card);box-shadow:var(--shadow);
}
h1{font-size:clamp(1.65rem,4vw,2.15rem);letter-spacing:-.045em;line-height:1.12;margin:0 0 10px}
p{color:var(--muted);line-height:1.65;margin:0 0 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.9rem;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;color:var(--accent);font-weight:750;letter-spacing:.02em}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:26px}
.bar div{height:100%;background:linear-gradient(90deg,var(--accent),#54c49a);border-radius:99px;transition:width .35s ease}
.q{font-size:clamp(1.12rem,2.5vw,1.35rem);font-weight:750;letter-spacing:-.02em;margin:0 0 20px;line-height:1.45;color:var(--fg)}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:15px 17px;margin-bottom:11px;border:1.5px solid var(--line);
  border-radius:15px;background:var(--card);color:var(--fg);
  line-height:1.45;transition:border-color .18s,background .18s,transform .18s;
}
.opt::before{
  content:"";flex:0 0 9px;width:9px;height:9px;border:2px solid var(--muted);
  border-radius:50%;opacity:.65;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--card))}
.opt.ok::before{background:var(--ok);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt.bad::before{background:var(--bad);border-color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 21px;border:0;border-radius:13px;background:var(--accent);
  color:var(--accent-fg);font-weight:750;margin:10px 8px 0 0;
  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 22%,transparent);
  transition:transform .18s,filter .18s;
}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.alt{background:transparent;color:var(--fg);border:1.5px solid var(--line);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:18px}
.cat{
  position:relative;min-height:130px;padding:19px 17px;border:1.5px solid var(--line);
  border-radius:17px;background:var(--card);color:var(--fg);text-align:left;
  transition:transform .2s,border-color .2s,box-shadow .2s,background .2s;
}
.cat:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-3px);box-shadow:0 10px 22px rgba(20,67,53,.07)}
.cat span{display:block;font-size:1.8rem;margin-bottom:12px}
.cat b{display:block;font-size:.98rem;line-height:1.3;margin-bottom:5px}
.cat small{color:var(--muted);font-size:.82rem;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 22px}
.chip{padding:9px 15px;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);font-size:.88rem;font-weight:650;transition:.18s}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0 24px}
.stat{padding:14px 13px;border:1px solid var(--line);border-radius:15px;background:color-mix(in srgb,var(--accent-soft) 42%,var(--card));min-width:0}
.stat strong{display:block;font-size:clamp(1.25rem,3vw,1.8rem);letter-spacing:-.04em;color:var(--accent);line-height:1.15;margin-bottom:5px}
.stat span{display:block;color:var(--muted);font-size:.76rem;line-height:1.35}
.dashboard-title{font-size:.82rem;color:var(--muted);font-weight:750;letter-spacing:.04em;text-transform:uppercase;margin:22px 0 0}

.score{font-size:clamp(3.2rem,10vw,4.6rem);font-weight:850;letter-spacing:-.06em;margin:14px 0;color:var(--accent)}
.exp{padding:15px 17px;border-radius:15px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);line-height:1.55;margin:10px 0 12px;font-size:.95rem}
#app>h1:first-child{margin-bottom:10px}
#app>.chips::before{content:"Tempo por pergunta";display:block;flex-basis:100%;font-size:.82rem;color:var(--muted);font-weight:750;letter-spacing:.04em;text-transform:uppercase}
#app>.grid::before{content:"Escolha uma área para começar";display:block;grid-column:1/-1;color:var(--muted);font-size:.82rem;font-weight:750;letter-spacing:.04em;text-transform:uppercase;margin:2px 0 0}
@media(max-width:520px){
  body{padding:10px}
  .card{margin:8px auto;padding:21px 17px;border-radius:21px}
  .grid{grid-template-columns:1fr;gap:10px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .stat{padding:12px}
  .cat{min-height:0;padding:15px;display:grid;grid-template-columns:42px 1fr;column-gap:12px;align-items:center}
  .cat span{grid-row:span 2;margin:0;font-size:1.65rem}
  .cat b{margin:0}
  .cat small{margin-top:3px}
  .top{font-size:.8rem;align-items:flex-start}
  .btn{width:100%;margin:9px 0 0}
  .opt{padding:14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

function loadTime(){try{return +localStorage.getItem("vet-time")||0}catch(e){return 0}}
function best(id){try{return +localStorage.getItem("vet-best-v2-"+id)||0}catch(e){return 0}}
function saveBest(id,n){try{if(n>best(id))localStorage.setItem("vet-best-v2-"+id,n)}catch(e){}}
function readStats(){try{return JSON.parse(localStorage.getItem("vet-stats-v2"))||{answered:0,correct:0,attempts:0,lastScore:null,lastTotal:0,lastArea:""}}catch(e){return {answered:0,correct:0,attempts:0,lastScore:null,lastTotal:0,lastArea:""}}}
function saveAnswer(isCorrect){const st=readStats();st.answered++;if(isCorrect)st.correct++;try{localStorage.setItem("vet-stats-v2",JSON.stringify(st))}catch(e){}}
function saveAttempt(){const st=readStats();st.attempts++;st.lastScore=score;st.lastTotal=list.length;st.lastArea=area.nome;st.lastAt=Date.now();try{localStorage.setItem("vet-stats-v2",JSON.stringify(st))}catch(e){}}
function rate(st){return st.answered?Math.round(st.correct/st.answered*100):0}

  const ch=document.getElementById("chips");
  [[0,"Sem tempo"],[10,"10 s"],[20,"20 s"],[30,"30 s"],[60,"60 s"]].forEach(([s,l])=>{
    const c=document.createElement("button");c.className="chip"+(TIME===s?" on":"");c.textContent=l;
    c.onclick=()=>{TIME=s;try{localStorage.setItem("vet-time",s)}catch(e){}ch.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on")};
    ch.appendChild(c);
  });
  const g=document.getElementById("grid");
  const m=document.createElement("button");m.className="cat";m.style.gridColumn="1 / -1";
  m.innerHTML=`<span>🎲</span><b>Modo Misto</b><small>15 perguntas sorteadas de todas as áreas · Melhor: ${best("misto")}/15</small>`;

}

Object.keys(EXTRA_EXPL).forEach(id=>EXPL[id].push(...EXTRA_EXPL[id]));

const ITEMS=AREAS.flatMap(x=>x.qs.map((q,k)=>({q,e:(EXPL[x.id]||[])[k]||"",a:x})));
const MIX={id:"misto",emoji:"🎲",nome:"Modo Misto"};
function play(a){area=a;list=a.id==="misto"?shuffle(ITEMS).slice(0,15):shuffle(ITEMS.filter(x=>x.a===a));i=0;score=0;show()}
function show(){
  locked=false;clearInterval(timerId);
  if(TIME){left=TIME;timerId=setInterval(()=>{left--;const t=document.getElementById("tl");if(t){t.textContent=left;if(left<=5)t.style.color="var(--bad)"}if(left<=0)pick(null)},1000)}
  const it=list[i],c=it.q;
  app.innerHTML=`<div class="top"><span class="tag">${it.a.emoji} ${it.a.nome}</span><span>${i+1}/${list.length} · ${score} pts${TIME?` · ⏱ <b id="tl">${TIME}</b>s`:""}</span></div>
  <div class="bar"><div style="width:${i/list.length*100}%"></div></div>
  <p class="q"></p><div id="opts"></div><button class="btn" id="next" style="display:none"></button>`;
  app.querySelector(".q").textContent=c[0];
  const box=document.getElementById("opts");
  shuffle(c.slice(1).map((t,k)=>({t,ok:k===0}))).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o.t;b.dataset.ok=o.ok?"1":"";
    b.onclick=()=>pick(b);box.appendChild(b);
  });
}
function pick(btn){
  if(locked)return;locked=true;clearInterval(timerId);
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.ok)b.classList.add("ok")});
  const isCorrect=!!(btn&&btn.dataset.ok);
  if(isCorrect)score++;else if(btn)btn.classList.add("bad");
  saveAnswer(isCorrect);
  const n=document.getElementById("next");
  const ex=document.createElement("div");ex.className="exp";ex.textContent=(btn&&btn.dataset.ok?"✅ Correto! ":btn?"❌ Incorreto. ":"⏰ Tempo esgotado. ")+list[i].e;n.before(ex);
  n.textContent=i+1<list.length?"Próxima":"Ver resultado";n.style.display="inline-block";
  n.onclick=()=>{i++;i<list.length?show():end()};
}
function end(){
  saveBest(area.id,score);saveAttempt();
  const p=score/list.length;
  const msg=p===1?"Perfeito! 🏆":p>=.6?"Muito bem! 👏":"Continue estudando! 💪";
  const st=readStats();
  app.innerHTML=`<h1>${msg}</h1><p>${area.emoji} ${area.nome}</p><div class="score">${score}/${list.length}</div><p>Melhor pontuação: ${best(area.id)}/${list.length} · Aproveitamento nesta rodada: ${Math.round(p*100)}%</p><div class="stats"><div class="stat"><strong>${st.answered}</strong><span>Questões respondidas</span></div><div class="stat"><strong>${rate(st)}%</strong><span>Taxa geral de acertos</span></div></div>
  <button class="btn" id="again">Jogar de novo</button><button class="btn alt" id="menu">Voltar ao início</button>`;
  document.getElementById("again").onclick=()=>play(area);
  document.getElementById("menu").onclick=menu;
}
menu();
</script>
