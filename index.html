ategoryId":"diagnostico","level":"medium","question":"Qual é a vantagem de comparar exames seriados do mesmo paciente?","options":["Permite observar tendência e evolução ao longo do tempo","Garante que todos os resultados sejam normais","Substitui exame físico","Elimina variação laboratorial"],"correctIndex":0,"explanation":"Tendências podem ser mais informativas que um valor isolado, desde que métodos e condições sejam comparáveis.","levelStatus":"editorial-triage"},{"id":"diagnostico-N19","categoryId":"diagnostico","level":"medium","question":"A tomografia computadorizada é particularmente útil para:","options":["Avaliação detalhada de estruturas e relações anatômicas em cortes","Medir diretamente glicemia","Identificar motilidade intestinal em tempo real","Substituir toda citologia"],"correctIndex":0,"explanation":"Tomografia fornece imagens seccionais e é útil em trauma, tórax, crânio e planejamento selecionado.","levelStatus":"editorial-triage"},{"id":"diagnostico-N20","categoryId":"diagnostico","level":"medium","question":"Qual cuidado é importante ao interpretar um teste rápido?","options":["Conhecer sensibilidade, especificidade e probabilidade pré-teste","Considerar todo positivo como infalível","Ignorar sinais clínicos","Aplicar o resultado a qualquer espécie"],"correctIndex":0,"explanation":"Testes rápidos têm limitações; desempenho e prevalência influenciam interpretação e necessidade de confirmação.","levelStatus":"editorial-triage"},{"id":"diagnostico-N21","categoryId":"diagnostico","level":"medium","question":"Uma citologia mostra células inflamatórias e bactérias intracelulares. O que isso sugere?","options":["Infecção bacteriana ativa é provável no contexto apropriado","Contaminação é impossível","Tumor maligno está confirmado","A amostra não tem valor"],"correctIndex":0,"explanation":"Bactérias intracelulares em células inflamatórias aumentam a suspeita de infecção, considerando qualidade da amostra.","levelStatus":"editorial-triage"},{"id":"diagnostico-N22","categoryId":"diagnostico","level":"medium","question":"Por que uma radiografia normal não exclui toda doença torácica?","options":["Algumas alterações podem ser precoces, sutis ou não detectáveis pela técnica","Radiografia sempre mostra todas as doenças","Imagem não depende de posicionamento","Todo tecido tem a mesma radiopacidade"],"correctIndex":0,"explanation":"Sensibilidade depende da doença, projeções, momento e qualidade técnica.","levelStatus":"editorial-triage"},{"id":"diagnostico-N23","categoryId":"diagnostico","level":"medium","question":"Qual é o papel do controle de qualidade laboratorial?","options":["Monitorar precisão e confiabilidade dos resultados","Escolher o diagnóstico antes do exame","Substituir calibração","Aumentar artificialmente valores"],"correctIndex":0,"explanation":"Controle de qualidade detecta variações e falhas analíticas que podem comprometer resultados.","levelStatus":"editorial-triage"},{"id":"diagnostico-N24","categoryId":"diagnostico","level":"hard","question":"O que é um falso negativo?","options":["Resultado negativo apesar de a condição investigada estar presente","Resultado positivo em animal saudável","Resultado sempre inconclusivo","Erro de identificação de espécie"],"correctIndex":0,"explanation":"Falso negativo pode ocorrer por sensibilidade limitada, fase da doença, amostra ou técnica.","levelStatus":"editorial-triage"},{"id":"diagnostico-N25","categoryId":"diagnostico","level":"hard","question":"Por que a urinálise inclui avaliação física, química e do sedimento?","options":["Cada etapa fornece informações complementares sobre concentração, composição e elementos celulares","Apenas a cor define doença","Sedimento substitui densidade","A química mede função cardíaca"],"correctIndex":0,"explanation":"A interpretação integrada aumenta a utilidade diagnóstica da urina.","levelStatus":"editorial-triage"},{"id":"diagnostico-N26","categoryId":"diagnostico","level":"hard","question":"Um animal tem ALT elevada, mas bilirrubina e função sintética preservadas. Qual interpretação é prudente?","options":["Pode haver lesão hepatocelular sem evidência suficiente de falência hepática","Insuficiência hepática está confirmada","ALT normaliza diagnóstico","A alteração é necessariamente extra-hepática"],"correctIndex":0,"explanation":"Enzimas de lesão e marcadores de função avaliam aspectos diferentes do fígado.","levelStatus":"editorial-triage"},{"id":"diagnostico-N27","categoryId":"diagnostico","level":"hard","question":"Qual amostra é mais apropriada para confirmar dermatofitose por cultura?","options":["Pelos e escamas da borda ativa da lesão, coletados adequadamente","Sangue venoso em tubo de citrato","Urina de jato médio","Fezes frescas"],"correctIndex":0,"explanation":"A coleta de pelos e escamas da área afetada aumenta a chance de detectar dermatófitos.","levelStatus":"editorial-triage"},{"id":"diagnostico-N28","categoryId":"diagnostico","level":"hard","question":"Qual é uma limitação da ultrassonografia em comparação com radiografia para avaliar pulmões aerados?","options":["O ar dificulta a transmissão do ultrassom e limita a avaliação profunda","Ultrassom usa radiação ionizante","Radiografia não mostra tórax","Ultrassom mede diretamente oxigênio"],"correctIndex":0,"explanation":"O ar reflete ondas sonoras; ultrassom torácico avalia pleura e lesões periféricas, não todo pulmão aerado.","levelStatus":"editorial-triage"},{"id":"diagnostico-N29","categoryId":"diagnostico","level":"hard","question":"Por que resultados de laboratório devem ser associados ao momento da coleta?","options":["Jejum, estresse, fluidoterapia e medicamentos podem modificar alguns parâmetros","O horário nunca influencia","Somente a raça altera resultados","Coleta não interfere em amostras"],"correctIndex":0,"explanation":"Condições pré-analíticas afetam resultados e devem ser registradas e consideradas.","levelStatus":"editorial-triage"},{"id":"diagnostico-N30","categoryId":"diagnostico","level":"hard","question":"O que significa sensibilidade diagnóstica?","options":["Proporção de indivíduos com a doença que o teste identifica como positivos","Proporção de saudáveis corretamente negativos","Probabilidade de doença após resultado","Precisão de uma balança"],"correctIndex":0,"explanation":"Sensibilidade mede a capacidade de detectar doentes; especificidade mede a identificação correta dos não doentes.","levelStatus":"editorial-triage"},{"id":"grandes-N11","categoryId":"grandes","level":"easy","question":"Qual compartimento do estômago dos ruminantes é conhecido como “estômago verdadeiro”?","options":["Abomaso","Rúmen","Retículo","Omaso"],"correctIndex":0,"explanation":"O abomaso possui secreção ácida e enzimática, sendo funcionalmente comparável ao estômago glandular.","levelStatus":"editorial-triage"},{"id":"grandes-N12","categoryId":"grandes","level":"easy","question":"O que é timpanismo ruminal?","options":["Acúmulo excessivo de gases no rúmen","Inflamação da glândula mamária","Fratura de casco","Infecção do útero"],"correctIndex":0,"explanation":"Timpanismo é distensão por gás e pode comprometer respiração e circulação, exigindo atendimento rápido.","levelStatus":"editorial-triage"},{"id":"grandes-N13","categoryId":"grandes","level":"easy","question":"Qual é uma função do retículo?","options":["Participar da seleção e movimentação de partículas e da ruminação","Produzir urina","Armazenar bile","Realizar trocas gasosas"],"correctIndex":0,"explanation":"Retículo atua em conjunto com o rúmen na seleção de partículas e regurgitação.","levelStatus":"editorial-triage"},{"id":"grandes-N14","categoryId":"grandes","level":"easy","question":"Em bovinos, o que caracteriza hipocalcemia puerperal?","options":["Queda do cálcio sanguíneo ao redor do parto","Aumento de glicose após exercício","Infecção pulmonar viral","Excesso de fósforo no leite"],"correctIndex":0,"explanation":"A demanda de cálcio para colostro e leite pode superar a capacidade de mobilização e absorção.","levelStatus":"editorial-triage"},{"id":"grandes-N15","categoryId":"grandes","level":"easy","question":"Qual medida auxilia a prevenção de doenças neonatais em bezerros?","options":["Ingestão precoce e adequada de colostro de boa qualidade","Separação do colostro nas primeiras horas","Oferta exclusiva de água","Atrasar a primeira mamada por dois dias"],"correctIndex":0,"explanation":"A absorção de imunoglobulinas é maior nas primeiras horas de vida e cai rapidamente.","levelStatus":"editorial-triage"},{"id":"grandes-N16","categoryId":"grandes","level":"easy","question":"O que é claudicação em equinos?","options":["Alteração da marcha associada a dor ou disfunção locomotora","Aumento do apetite","Perda de visão noturna","Dificuldade de ruminar"],"correctIndex":0,"explanation":"Claudicação descreve alteração locomotora e requer localização da origem e avaliação da gravidade.","levelStatus":"editorial-triage"},{"id":"grandes-N17","categoryId":"grandes","level":"medium","question":"Um cavalo apresenta cólica intensa e sudorese. Qual conduta é mais adequada?","options":["Acionar atendimento veterinário urgente e evitar medicações sem orientação","Forçar alimentação","Exercitar até cansar","Administrar óleo por via oral sem avaliação"],"correctIndex":0,"explanation":"Cólica pode evoluir rapidamente; manejo e analgesia devem ser orientados por veterinário.","levelStatus":"editorial-triage"},{"id":"grandes-N18","categoryId":"grandes","level":"medium","question":"Qual é o objetivo do casqueamento funcional?","options":["Manter equilíbrio e distribuição adequada de cargas no casco","Aumentar a altura do animal","Eliminar toda sensibilidade","Substituir avaliação locomotora"],"correctIndex":0,"explanation":"Casqueamento busca equilíbrio e apoio adequado, considerando conformação, atividade e alterações individuais.","levelStatus":"editorial-triage"},{"id":"grandes-N19","categoryId":"grandes","level":"medium","question":"Por que a mastite subclínica é relevante em rebanhos leiteiros?","options":["Pode reduzir produção e qualidade do leite sem sinais visíveis marcantes","Sempre causa febre alta","Não altera leite","É transmitida por mosquitos"],"correctIndex":0,"explanation":"Mastite subclínica pode ser detectada por contagem de células somáticas e testes apropriados.","levelStatus":"editorial-triage"},{"id":"grandes-N20","categoryId":"grandes","level":"medium","question":"Qual é a finalidade do teste da caneca de fundo escuro?","options":["Identificar alterações visíveis no leite dos primeiros jatos","Medir glicemia da vaca","Avaliar fertilidade do touro","Detectar fraturas"],"correctIndex":0,"explanation":"O teste ajuda a observar grumos e alterações do leite, compondo rotina de ordenha e triagem.","levelStatus":"editorial-triage"},{"id":"grandes-N21","categoryId":"grandes","level":"medium","question":"Em ruminantes, acidose ruminal pode ocorrer após:","options":["Ingestão excessiva de carboidratos rapidamente fermentáveis","Consumo moderado de volumoso","Acesso contínuo à água limpa","Caminhada leve"],"correctIndex":0,"explanation":"Excesso de concentrado pode reduzir pH ruminal e alterar microbiota e motilidade.","levelStatus":"editorial-triage"},{"id":"grandes-N22","categoryId":"grandes","level":"medium","question":"Qual é a importância do período de transição em vacas leiteiras?","options":["É uma fase de grandes adaptações metabólicas e maior risco de doenças","Não há mudanças fisiológicas","A produção de leite já terminou","O consumo de alimento sempre aumenta"],"correctIndex":0,"explanation":"O período próximo ao parto exige manejo nutricional e monitoramento de doenças metabólicas.","levelStatus":"editorial-triage"},{"id":"grandes-N23","categoryId":"grandes","level":"medium","question":"O que pode indicar infertilidade em um touro no exame andrológico?","options":["Alterações de motilidade, morfologia ou condição reprodutiva","Apenas pelagem clara","Aumento do comprimento da cauda","Temperatura ambiental amena"],"correctIndex":0,"explanation":"A avaliação andrológica integra exame físico e qualidade seminal para estimar aptidão reprodutiva.","levelStatus":"editorial-triage"},{"id":"grandes-N24","categoryId":"grandes","level":"hard","question":"Qual medida é essencial para reduzir disseminação de doenças em propriedades?","options":["Quarentena e avaliação de animais recém-introduzidos","Misturar imediatamente todos os lotes","Compartilhar agulhas","Eliminar registros sanitários"],"correctIndex":0,"explanation":"Quarentena, vigilância e biossegurança reduzem introdução e disseminação de agentes.","levelStatus":"editorial-triage"},{"id":"grandes-N25","categoryId":"grandes","level":"hard","question":"Em equinos, a laminite pode resultar em rotação ou afundamento de qual estrutura?","options":["Falange distal em relação à cápsula do casco","Escápula","Atlas","Rádio"],"correctIndex":0,"explanation":"A inflamação e falha laminar podem comprometer a conexão entre falange distal e parede do casco.","levelStatus":"editorial-triage"},{"id":"grandes-N26","categoryId":"grandes","level":"hard","question":"Qual é o principal risco de administrar anti-inflamatório sem avaliar hidratação em equinos?","options":["Possível agravamento de lesão renal e gastrointestinal","Aumento da visão","Crescimento acelerado do casco","Redução de parasitas"],"correctIndex":0,"explanation":"Anti-inflamatórios podem causar efeitos renais e gastrointestinais, especialmente em animais desidratados.","levelStatus":"editorial-triage"},{"id":"grandes-N27","categoryId":"grandes","level":"hard","question":"Por que a identificação individual do rebanho é importante?","options":["Permite rastreabilidade, histórico sanitário e manejo reprodutivo","Serve apenas para estética","Elimina vacinação","Substitui exame clínico"],"correctIndex":0,"explanation":"Identificação confiável sustenta registros de saúde, produção, reprodução e movimentação.","levelStatus":"editorial-triage"},{"id":"grandes-N28","categoryId":"grandes","level":"hard","question":"Qual condição pode causar edema de úbere e dificuldade de ordenha no pós-parto?","options":["Edema mamário","Timpanismo ruminal","Cólica renal","Dermatofitose de casco"],"correctIndex":0,"explanation":"Edema de úbere é acúmulo de líquido e deve ser diferenciado de mastite e outras alterações.","levelStatus":"editorial-triage"},{"id":"grandes-N29","categoryId":"grandes","level":"hard","question":"Qual princípio orienta o uso de antimicrobianos em animais de produção?","options":["Uso responsável, diagnóstico e respeito aos períodos de carência","Uso preventivo indiscriminado","Interromper sempre após uma dose","Usar sobras de outro lote"],"correctIndex":0,"explanation":"Uso prudente reduz resistência e protege saúde animal, humana e segurança dos alimentos.","levelStatus":"editorial-triage"},{"id":"grandes-N30","categoryId":"grandes","level":"hard","question":"Uma vaca apresenta queda de produção, febre e leite alterado em um quarto mamário. Qual hipótese deve ser investigada?","options":["Mastite clínica","Cetose subclínica obrigatória","Laminite","Hipocalcemia sem relação mamária"],"correctIndex":0,"explanation":"Sinais locais no úbere e alteração do leite são compatíveis com mastite e justificam exame e amostragem.","levelStatus":"editorial-triage"},{"id":"parasito-N11","categoryId":"parasito","level":"easy","question":"Em quais animais ocorre a fase sexuada do ciclo de Toxoplasma gondii?","options":["Felídeos","Bovinos","Cães","Equinos"],"correctIndex":0,"explanation":"A fase sexuada ocorre no epitélio intestinal de felídeos; outros hospedeiros podem abrigar fases assexuadas.","levelStatus":"editorial-triage"},{"id":"parasito-N12","categoryId":"parasito","level":"easy","question":"Qual é a via comum de infecção por Giardia em cães?","options":["Ingestão de cistos em água, alimento ou ambiente contaminado","Picada de carrapato","Inalação de ovos","Contato com saliva de aves"],"correctIndex":0,"explanation":"A transmissão é fecal-oral, com ingestão de cistos infectantes.","levelStatus":"editorial-triage"},{"id":"parasito-N13","categoryId":"parasito","level":"easy","question":"Qual ectoparasita pode transmitir Ehrlichia canis?","options":["Carrapato marrom do cão (Rhipicephalus sanguineus sensu lato)","Pulga do gato exclusivamente","Mosca doméstica","Piolho humano"],"correctIndex":0,"explanation":"O carrapato marrom é vetor importante de E. canis em cães.","levelStatus":"editorial-triage"},{"id":"parasito-N14","categoryId":"parasito","level":"easy","question":"O que significa hospedeiro intermediário?","options":["Organismo no qual ocorre fase larval ou assexuada do parasita","Organismo que sempre elimina o parasita","Animal sem contato com o ciclo","Vetor mecânico obrigatório"],"correctIndex":0,"explanation":"Hospedeiro intermediário abriga fases do desenvolvimento, sem ser necessariamente o local de reprodução sexuada.","levelStatus":"editorial-triage"},{"id":"parasito-N15","categoryId":"parasito","level":"easy","question":"Qual medida reduz risco de ancilostomíase zoonótica?","options":["Recolher fezes e evitar contato da pele com solo contaminado","Andar descalço em áreas com fezes","Compartilhar caixas de areia sem limpeza","Suspender vermifugação orientada"],"correctIndex":0,"explanation":"Larvas podem penetrar a pele; higiene e manejo de fezes reduzem exposição.","levelStatus":"editorial-triage"},{"id":"parasito-N16","categoryId":"parasito","level":"easy","question":"Qual é a importância do controle integrado de ectoparasitas?","options":["Interromper fases do ciclo no animal e no ambiente quando indicado","Tratar somente coceira","Usar vários produtos simultaneamente sem orientação","Eliminar necessidade de limpeza"],"correctIndex":0,"explanation":"O ciclo de pulgas e alguns vetores envolve ambiente e hospedeiro, exigindo estratégia consistente.","levelStatus":"editorial-triage"},{"id":"parasito-N17","categoryId":"parasito","level":"medium","question":"Um cão tem anemia, trombocitopenia e histórico de carrapatos. Qu function play(a){

  let pool=a.id==="misto"?[...ITEMS]:ITEMS.filter(x=>x.category===a);
  if(selectedDifficulty!=="all")pool=pool.filter(x=>x.level===selectedDifficulty);
  const amount=a.id==="misto"?(selectedDifficulty==="all"?45:15):(selectedDifficulty==="all"?45:ITEMS.filter(x=>x.category===a&&x.level===selectedDifficulty).length);

function show(){
  locked=false;clearInterval(timerId);
  if(TIME){left=TIME;timerId=setInterval(()=>{left--;const t=document.getElementById("tl");if(t){t.textContent=left;if(left<=5)t.style.color="var(--bad)"}if(left<=0)pick(null)},1000)}
  const it=list[i],c=it;
  app.innerHTML=`<div class="top"><span class="tag">${it.category.emoji} ${it.category.nome} · ${LEVELS[selectedDifficulty]}</span><span>${i+1}/${list.length} · ${score} pts${TIME?` · ⏱ <b id="tl">${TIME}</b>s`:""}</span></div>
  <div class="bar"><div style="width:${i/list.length*100}%"></div></div>
  <p class="q"></p><div id="opts"></div><button class="btn" id="next" style="display:none"></button>`;
  app.querySelector(".q").textContent=c.question;
  const box=document.getElementById("opts");
  shuffle(c.options.map((t,k)=>({t,ok:k===c.correctIndex}))).forEach(o=>{
    const b=document.createElement("button");b.className="opt";b.textContent=o.t;b.dataset.ok=o.ok?"1":"";
    b.onclick=()=>pick(b);box.appendChild(b);
  });
}
function pick(btn){
  if(locked)return;locked=true;clearInterval(timerId);
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.ok)b.classList.add("ok")});
  const isCorrect=!!(btn&&btn.dataset.ok);
  if(isCorrect)score++;else if(btn)btn.classList.add("bad");
  saveAnswer(isCorrect);recordAreaAnswer(list[i],isCorrect);recordDetailedAnswer(list[i],isCorrect);
  const n=document.getElementById("next");
  const ex=document.createElement("div");ex.className="exp";ex.textContent=(btn&&btn.dataset.ok?"✅ Correto! ":btn?"❌ Incorreto. ":"⏰ Tempo esgotado. ")+list[i].explanation;n.before(ex);
  n.textContent=i+1<list.length?"Próxima":"Ver resultado";n.style.display="inline-block";
  n.onclick=()=>{i++;i<list.length?show():end()};
}
function end(){

  const total=st.answered||0, correct=st.correct||0, wrong=Math.max(0,total-correct);
  const areaRows=AREAS.map(a=>{
    const x=Object.values(areas[a.id]||{}).reduce((r,v)=>({n:r.n+(v.n||0),c:r.c+(v.c||0)}),{n:0,c:0});
    return {...a,...x,p:pct(x.c,x.n)};
  });
  const levelRows=[["easy","Fácil"],["medium","Intermediário"],["hard","Difícil"]].map(([id,label])=>{
    const x=Object.values(areas).reduce((r,a)=>{const v=a[id]||{};return {n:r.n+(v.n||0),c:r.c+(v.c||0)}},{n:0,c:0});
    return {label,...x,p:pct(x.c,x.n)};
  });
  const bars=areaRows.map(a=>`<div class="rk"><div class="rk-main"><strong>${a.emoji} ${a.nome}</strong><div class="bar"><div style="width:${a.p}%"></div></div><small>${a.n?`${a.c} acertos em ${a.n} respostas`:"Ainda sem respostas registradas"}</small></div><em>${a.n?a.p+"%":"—"}</em></div>`).join("");
  const levels=levelRows.map(a=>`<div class="rk"><div class="rk-main"><strong>${a.label}</strong><div class="bar"><div style="width:${a.p}%"></div></div><small>${a.n?`${a.c} acertos em ${a.n} respostas`:"Ainda sem respostas registradas"}</small></div><em>${a.n?a.p+"%":"—"}</em></div>`).join("");
  const recent=[...hist].sort((a,b)=>(b.d||0)-(a.d||0)).slice(0,10);
  const nm=id=>{const a=AREAS.find(x=>x.id===id);return id==="misto"?"🎲 Modo Misto":a?`${a.emoji} ${a.nome}`:id};
  const recentHtml=recent.length?recent.map(h=>`<div class="rk"><div class="rk-main"><strong>${nm(h.a)}</strong><small>${LEVELS[h.l]||"Dificuldade não informada"} · ${new Date(h.d).toLocaleString("pt-BR")}</small></div><em>${h.s}/${h.t} · ${pct(h.s,h.t)}%</em></div>`).join(""):"<p>Conclua uma rodada para começar seu histórico.</p>";
  app.innerHTML=`<div class="section-heading"><div><span class="eyebrow">SEU PROGRESSO</span><h2>📊 Meu Desempenho</h2></div></div>
  <p>Visão geral do seu percurso de aprendizagem neste navegador.</p>
  <div class="stats"><div class="stat"><strong>${total}</strong><span>Questões respondidas</span></div><div class="stat"><strong>${pct(correct,total)}%</strong><span>Taxa de acertos</span></div><div class="stat"><strong>${correct}</strong><span>Acertos</span></div><div class="stat"><strong>${wrong}</strong><span>Erros / tempo esgotado</span></div><div class="stat"><strong>${st.attempts||0}</strong><span>Rodadas concluídas</span></div><div class="stat"><strong>${log.length}</strong><span>Respostas detalhadas desde a V1</span></div></div>
  <div class="rk-sub">Desempenho por disciplina</div>${bars}
  <div class="rk-sub">Desempenho por dificuldade</div>${levels}
  <div class="rk-sub">Rodadas recentes</div>${recentHtml}
  <p style="font-size:.78rem;color:var(--muted);margin-top:18px">Os totais e o histórico anteriores foram preservados. O registro detalhado de cada resposta começa nesta versão e fica salvo neste navegador. Rodadas antigas não possuem detalhes individuais retroativos.</p>
  <button class="btn" id="performanceBack">Voltar ao início</button>`;
  document.getElementById("performanceBack").onclick=menu;
}
function ranking(){
  const st=readAreaStats(),hist=readHistory();
  const pct=(c,n)=>n?Math.round(c/n*100):0;
  const sum=o=>Object.values(o||{}).reduce((r,x)=>({n:r.n+x.n,c:r.c+x.c}),{n:0,c:0});
  const nm=id=>{const a=AREAS.find(x=>x.id===id);return id==="misto"?"🎲 Modo Misto":a?`${a.emoji} ${a.nome}`:id};
  let rows;
  if(rankView==="all"){
    rows=AREAS.map(a=>({t:nm(a.id),extra:"",...sum(st[a.id])}));
  }else{
    const a=AREAS.find(x=>x.id===rankView);
    rows=[["easy","🟢 Fácil"],["medium","🟡 Médio"],["hard","🔴 Difícil"]].map(([lv,l])=>{
      const r=(st[a.id]||{})[lv]||{n:0,c:0},b=best(a.id,lv);
      return {t:l,extra:b?` · recorde ${b}/${ITEMS.filter(x=>x.category===a&&x.level===lv).length}`:"",...r};
    });
  }
  rows=rows.filter(r=>r.n).sort((x,y)=>pct(y.c,y.n)-pct(x.c,x.n)||y.n-x.n);
  const tot=sum(rankView==="all"?Object.fromEntries(AREAS.flatMap(a=>Object.entries(st[a.id]||{}).map(([k,v])=>[a.id+k,v]))):st[rankView]);
  const rowsHtml=rows.length?rows.map((r,k)=>`<div class="rk"><b>${k+1}º</b><div class="rk-main"><strong>${r.t}</strong><div class="bar"><div style="width:${pct(r.c,r.n)}%"></div></div><small>${r.c} acertos em ${r.n} respostas${r.extra}</small></div><em>${pct(r.c,r.n)}%</em></div>`).join(""):`<p>Responda algumas perguntas para aparecer aqui.</p>`;
  const rounds=hist.filter(h=>rankView==="all"||h.a===rankView).sort((x,y)=>pct(y.s,y.t)-pct(x.s,x.t)||y.t-x.t||y.d-x.d).slice(0,5);
  const roundsHtml=rounds.length?rounds.map((h,k)=>`<div class="rk"><b>${k+1}º</b><div class="rk-main"><strong>${nm(h.a)}</strong><small>${LEVELS[h.l]||""} · ${new Date(h.d).toLocaleDateString("pt-BR")}</small></div><em>${h.s}/${h.t}</em></div>`).join(""):`<p>Termine uma rodada para ver suas melhores aqui.</p>`;
  app.innerHTML=`<div class="section-heading"><div><span class="eyebrow">MEU DESEMPENHO</span><h2>🏆 Meu ranking</h2></div></div>
  <select class="sel" id="rkSel" aria-label="Escolher tema do ranking"><option value="all">Todas as áreas juntas</option>${AREAS.map(a=>`<option value="${a.id}">${a.emoji} ${a.nome}</option>`).join("")}</select>
  <p>${tot.n?`${tot.c} acertos em ${tot.n} respostas · ${pct(tot.c,tot.n)}% de aproveitamento`:"Ainda sem respostas neste tema."}</p>
  <div class="rk-sub">${rankView==="all"?"Áreas por aproveitamento":"Níveis por aproveitamento"}</div>${rowsHtml}
  <div class="rk-sub">Suas 5 melhores rodadas</div>${roundsHtml}
  <p style="margin-top:16px;font-size:.82rem">O ranking é só seu e fica salvo neste navegador. Ele conta as respostas dadas a partir desta atualização.</p>
  <button class="btn" id="rkBack">Voltar ao início</button>`;
  const sel=document.getElementById("rkSel");sel.value=rankView;sel.onchange=e=>{rankView=e.target.value;ranking()};
  document.getElementById("rkBack").onclick=menu;
}
// Verificações estruturais para detectar inconsistências no banco.
const BANK_ERRORS=ITEMS.filter(it=>!it.question||it.options.length!==4||!Number.isInteger(it.correctIndex)||it.correctIndex<0||it.correctIndex>=it.options.length||!it.explanation);
if(BANK_ERRORS.length)console.error("VetQuiz: questões com cadastro incompleto",BANK_ERRORS);
if(ITEMS.length!==450)console.error(`VetQuiz: esperado 450 registros nesta versão; encontrados ${ITEMS.length}.`);
const CATEGORY_COUNTS=AREAS.map(a=>({id:a.id,total:ITEMS.filter(x=>x.category===a).length,easy:ITEMS.filter(x=>x.category===a&&x.level==="easy").length,medium:ITEMS.filter(x=>x.category===a&&x.level==="medium").length,hard:ITEMS.filter(x=>x.category===a&&x.level==="hard").length}));
if(CATEGORY_COUNTS.some(c=>c.total!==45||c.easy!==15||c.medium!==15||c.hard!==15))console.error("VetQuiz: distribuição por categoria inconsistente",CATEGORY_COUNTS);
menu();
</script>
