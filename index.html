<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="VetQuiz: plataforma de estudos e prática em Medicina Veterinária.">
<title>VetQuiz — Central de Estudos Veterinários</title>
<meta name="application-version" content="1.3-expansao-250">
<style>
:root{
  --bg:#f2f7f5;--fg:#172b27;--card:#ffffff;--muted:#64756f;
  --accent:#087f68;--accent-fg:#ffffff;--accent-soft:#e2f3ed;
  --ok:#168653;--bad:#d64b4b;--line:#dce8e2;
  --shadow:0 18px 55px rgba(20,67,53,.10);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101a17;--fg:#edf7f2;--card:#192622;--muted:#a3b5ad;
    --accent:#49c6a1;--accent-fg:#08231b;--accent-soft:#203b32;
    --ok:#55d69a;--bad:#ff8585;--line:#30443c;
    --shadow:0 18px 55px rgba(0,0,0,.24);
  }
}
:root[data-theme="dark"]{
  --bg:#101a17;--fg:#edf7f2;--card:#192622;--muted:#a3b5ad;
  --accent:#49c6a1;--accent-fg:#08231b;--accent-soft:#203b32;
  --ok:#55d69a;--bad:#ff8585;--line:#30443c;
  --shadow:0 18px 55px rgba(0,0,0,.24);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
  padding:clamp(14px,3vw,34px);
  background:
    radial-gradient(circle at 8% 5%,rgba(8,127,104,.10),transparent 28rem),
    radial-gradient(circle at 95% 90%,rgba(72,178,139,.10),transparent 25rem),var(--bg);
  color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:3px}
.card{
  width:100%;max-width:760px;align-self:flex-start;margin:clamp(8px,3vh,30px) auto;
  padding:clamp(20px,4vw,38px);border:1px solid var(--line);border-radius:26px;
  background:var(--card);box-shadow:var(--shadow);
}
h1{font-size:clamp(1.65rem,4vw,2.15rem);letter-spacing:-.045em;line-height:1.12;margin:0 0 10px}
p{color:var(--muted);line-height:1.65;margin:0 0 16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--muted);font-size:.9rem;margin-bottom:14px}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:.82rem;color:var(--accent);font-weight:750;letter-spacing:.02em}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:26px}
.bar div{height:100%;background:linear-gradient(90deg,var(--accent),#54c49a);border-radius:99px;transition:width .35s ease}
.q{font-size:clamp(1.12rem,2.5vw,1.35rem);font-weight:750;letter-spacing:-.02em;margin:0 0 20px;line-height:1.45;color:var(--fg)}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:15px 17px;margin-bottom:11px;border:1.5px solid var(--line);
  border-radius:15px;background:var(--card);color:var(--fg);
  line-height:1.45;transition:border-color .18s,background .18s,transform .18s;
}
.opt::before{
  content:"";flex:0 0 9px;width:9px;height:9px;border:2px solid var(--muted);
  border-radius:50%;opacity:.65;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft);transform:translateY(-1px)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--card))}
.opt.ok::before{background:var(--ok);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.opt.bad::before{background:var(--bad);border-color:var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:13px 21px;border:0;border-radius:13px;background:var(--accent);
  color:var(--accent-fg);font-weight:750;margin:10px 8px 0 0;
  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 22%,transparent);
  transition:transform .18s,filter .18s;
}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.alt{background:transparent;color:var(--fg);border:1.5px solid var(--line);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:18px}
.cat{
  position:relative;min-height:130px;padding:19px 17px;border:1.5px solid var(--line);
  border-radius:17px;background:var(--card);color:var(--fg);text-align:left;
  transition:transform .2s,border-color .2s,box-shadow .2s,background .2s;
}
.cat:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-3px);box-shadow:0 10px 22px rgba(20,67,53,.07)}
.cat span{display:block;font-size:1.8rem;margin-bottom:12px}
.cat b{display:block;font-size:.98rem;line-height:1.3;margin-bottom:5px}
.cat small{color:var(--muted);font-size:.82rem;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 22px}
.chip{padding:9px 15px;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);font-size:.88rem;font-weight:650;transition:.18s}
.chip:hover{border-color:var(--accent)}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0 24px}
.stat{padding:14px 13px;border:1px solid var(--line);border-radius:15px;background:color-mix(in srgb,var(--accent-soft) 42%,var(--card));min-width:0}
.stat strong{display:block;font-size:clamp(1.25rem,3vw,1.8rem);letter-spacing:-.04em;color:var(--accent);line-height:1.15;margin-bottom:5px}
.stat span{display:block;color:var(--muted);font-size:.76rem;line-height:1.35}
.dashboard-title{font-size:.82rem;color:var(--muted);font-weight:750;letter-spacing:.04em;text-transform:uppercase;margin:22px 0 0}

.score{font-size:clamp(3.2rem,10vw,4.6rem);font-weight:850;letter-spacing:-.06em;margin:14px 0;color:var(--accent)}
.exp{padding:15px 17px;border-radius:15px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);line-height:1.55;margin:10px 0 12px;font-size:.95rem}
#app>h1:first-child{margin-bottom:10px}
#app>.chips::before{content:"Tempo por pergunta";display:block;flex-basis:100%;font-size:.82rem;color:var(--muted);font-weight:750;letter-spacing:.04em;text-transform:uppercase}
#app>.grid::before{content:"Escolha uma área para começar";display:block;grid-column:1/-1;color:var(--muted);font-size:.82rem;font-weight:750;letter-spacing:.04em;text-transform:uppercase;margin:2px 0 0}

.difficulty-wrap{margin:18px 0 8px}
.difficulty-title{font-size:.82rem;color:var(--muted);font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:9px}.difficulty-note{font-size:.78rem;margin:-2px 0 10px;color:var(--muted)}
.difficulties{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.difficulty{padding:11px 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font-weight:750;font-size:.88rem}
.difficulty.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.difficulty small{display:block;font-size:.7rem;font-weight:600;color:var(--muted);margin-top:3px}
.level-tag{display:inline-flex;padding:4px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:.76rem;font-weight:800;margin:0 0 12px}
@media(max-width:520px){.difficulties{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){
  body{padding:10px}
  .card{margin:8px auto;padding:21px 17px;border-radius:21px}
  .grid{grid-template-columns:1fr;gap:10px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  .stat{padding:12px}
  .cat{min-height:0;padding:15px;display:grid;grid-template-columns:42px 1fr;column-gap:12px;align-items:center}
  .cat span{grid-row:span 2;margin:0;font-size:1.65rem}
  .cat b{margin:0}
  .cat small{margin-top:3px}
  .top{font-size:.8rem;align-items:flex-start}
  .btn{width:100%;margin:9px 0 0}
  .opt{padding:14px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

  try{

ial-triage"},{"id":"anestesia-N04","categoryId":"anestesia","level":"easy","question":"Qual é uma finalidade da analgesia multimodal?","options":["Combinar mecanismos diferentes para melhorar o controle da dor","Usar sempre a dose máxima de um único fármaco","Eliminar toda necessidade de monitorização","Substituir avaliação da dor"],"correctIndex":0,"explanation":"A combinação racional de modalidades pode melhorar analgesia e reduzir a necessidade de doses elevadas de um único agente.","levelStatus":"editorial-triage"},{"id":"anestesia-N05","categoryId":"anestesia","level":"medium","question":"Durante anestesia, EtCO₂ sobe progressivamente e a ventilação está reduzida. Qual hipótese deve ser considerada?","options":["Hipoventilação alveolar","Hiperventilação","Hipoglicemia isolada","Hipotermia como única explicação"],"correctIndex":0,"explanation":"A elevação de EtCO₂ pode indicar hipoventilação, embora perfusão, espaço morto e equipamento também influenciem o valor.","levelStatus":"editorial-triage"},{"id":"anestesia-N06","categoryId":"anestesia","level":"medium","question":"Após indução com propofol, ocorre apneia. Qual medida é prioritária?","options":["Garantir via aérea e suporte ventilatório, monitorando o paciente","Administrar mais propofol","Retirar toda monitorização","Aguardar sem intervir"],"correctIndex":0,"explanation":"Propofol pode causar depressão respiratória e apneia; suporte ventilatório e monitorização são fundamentais.","levelStatus":"editorial-triage"},{"id":"anestesia-N07","categoryId":"anestesia","level":"medium","question":"Por que a pressão arterial deve ser interpretada junto com outros parâmetros?","options":["Porque perfusão depende também de débito cardíaco, resistência vascular e contexto","Porque pressão arterial não tem relação com perfusão","Porque frequência cardíaca sempre substitui pressão","Porque uma medida isolada define o prognóstico"],"correctIndex":0,"explanation":"Pressão é importante, mas deve ser integrada a pulso, mucosas, temperatura periférica, lactato e demais dados.","levelStatus":"editorial-triage"},{"id":"anestesia-N08","categoryId":"anestesia","level":"hard","question":"Paciente anestesiado apresenta SpO₂ normal, mas EtCO₂ muito baixo e pulso fraco. Qual interpretação é prudente?","options":["Investigar redução de perfusão ou problema de amostragem, sem assumir ventilação adequada","Concluir que todo o transporte de oxigênio está normal","Descartar instabilidade circulatória","Diagnosticar hiperglicemia"],"correctIndex":0,"explanation":"EtCO₂ pode cair com baixo fluxo pulmonar; SpO₂ normal não exclui comprometimento circulatório ou outras alterações.","levelStatus":"editorial-triage"},{"id":"anestesia-N09","categoryId":"anestesia","level":"hard","question":"Qual limitação importante existe ao usar o oxímetro de pulso em paciente com vasoconstrição intensa?","options":["Sinal periférico pode ficar fraco e a leitura menos confiável","O aparelho mede diretamente débito cardíaco","A leitura se torna sempre falsamente alta","O oxímetro substitui capnografia"],"correctIndex":0,"explanation":"Perfusão periférica ruim, movimento e pigmentação podem comprometer o sinal; a leitura deve ser avaliada criticamente.","levelStatus":"editorial-triage"},{"id":"anestesia-N10","categoryId":"anestesia","level":"hard","question":"Em anestesia, hipotensão persistente exige qual abordagem?","options":["Confirmar a medida e investigar profundidade anestésica, volume, função cardíaca e vasodilatação","Aumentar automaticamente o anestésico","Ignorar se o ECG estiver regular","Administrar fluido em volume fixo para todo paciente"],"correctIndex":0,"explanation":"A causa pode ser multifatorial; a intervenção deve ser individualizada e guiada por avaliação hemodinâmica.","levelStatus":"editorial-triage"},{"id":"diagnostico-N01","categoryId":"diagnostico","level":"easy","question":"Qual amostra é normalmente utilizada para urinálise?","options":["Urina","Soro","Líquido sinovial","Swab nasal"],"correctIndex":0,"explanation":"A urinálise avalia características físicas, químicas e sedimento de uma amostra de urina.","levelStatus":"editorial-triage"},{"id":"diagnostico-N02","categoryId":"diagnostico","level":"easy","question":"O que uma radiografia torácica pode ajudar a avaliar?","options":["Pulmões, silhueta cardíaca e estruturas torácicas","Atividade elétrica cerebral","Motilidade intestinal em tempo real","Composição química do sangue"],"correctIndex":0,"explanation":"Radiografias torácicas fornecem imagens de pulmões, coração, vasos e outras estruturas, conforme posicionamento e qualidade.","levelStatus":"editorial-triage"},{"id":"diagnostico-N03","categoryId":"diagnostico","level":"easy","question":"Qual exame observa células e microrganismos em material coletado de uma lesão?","options":["Citologia","Eletrocardiograma","Ecocardiograma","Teste de tolerância à glicose"],"correctIndex":0,"explanation":"A citologia examina células e, em alguns materiais, agentes infecciosos; pode orientar a necessidade de cultura ou biópsia.","levelStatus":"editorial-triage"},{"id":"diagnostico-N04","categoryId":"diagnostico","level":"easy","question":"Qual procedimento obtém uma pequena amostra tecidual para análise histológica?","options":["Coleta de tecido para avaliação histopatológica","Coleta de sangue para hemograma","Registro da atividade elétrica cardíaca","Imagem por ondas sonoras"],"correctIndex":0,"explanation":"A biópsia obtém fragmento ou amostra tecidual para análise microscópica da arquitetura e das células.","levelStatus":"editorial-triage"},{"id":"diagnostico-N05","categoryId":"diagnostico","level":"medium","question":"Um cão tem creatinina elevada. Qual dado ajuda a interpretar o resultado?","options":["Hidratação, densidade urinária, tendência temporal e contexto clínico","Somente a cor dos olhos","Apenas o peso da coleira","Comprimento das unhas"],"correctIndex":0,"explanation":"Creatinina depende de fatores como massa muscular e perfusão; urinálise, hidratação e evolução ajudam na interpretação.","levelStatus":"editorial-triage"},{"id":"diagnostico-N06","categoryId":"diagnostico","level":"medium","question":"Por que a coleta e o armazenamento da amostra importam?","options":["Erros pré-analíticos podem alterar resultados e gerar interpretações incorretas","Porque o laboratório corrige qualquer erro","Porque todas as amostras são estáveis por tempo ilimitado","Porque o recipiente nunca interfere"],"correctIndex":0,"explanation":"Hemólise, contaminação, temperatura e tempo podem modificar resultados antes mesmo da análise.","levelStatus":"editorial-triage"},{"id":"diagnostico-N07","categoryId":"diagnostico","level":"medium","question":"Ultrassonografia mostra líquido livre abdominal em paciente traumatizado. Qual é a próxima interpretação?","options":["Achado relevante que deve ser integrado à estabilidade e investigação da origem","Confirma automaticamente ruptura de bexiga","Exclui hemorragia","Define sozinho necessidade de cirurgia"],"correctIndex":0,"explanation":"Líquido livre pode ter diferentes origens; a decisão depende de estabilidade, exame, amostragem e evolução.","levelStatus":"editorial-triage"},{"id":"diagnostico-N08","categoryId":"diagnostico","level":"hard","question":"Um cão apresenta anemia regenerativa e bilirrubina elevada. Qual mecanismo deve ser investigado?","options":["Hemólise, entre outras causas de anemia regenerativa","Deficiência isolada de ferro como única hipótese","Doença exclusivamente renal","Hipoplasia medular confirmada"],"correctIndex":0,"explanation":"Anemia regenerativa sugere resposta medular; hemólise e perda sanguínea são diferenciais, e bilirrubina pode apoiar investigação de hemólise.","levelStatus":"editorial-triage"},{"id":"diagnostico-N09","categoryId":"diagnostico","level":"hard","question":"Uma ALT discretamente elevada em exame isolado de animal assintomático indica o quê?","options":["Necessidade de contextualizar magnitude, tendência e outros achados","Diagnóstico definitivo de hepatite","Falência hepática confirmada","Indicação automática de biópsia"],"correctIndex":0,"explanation":"ALT é marcador de lesão hepatocelular, não medida direta da função hepática nem diagnóstico etiológico.","levelStatus":"editorial-triage"},{"id":"diagnostico-N10","categoryId":"diagnostico","level":"hard","question":"Em um paciente com suspeita de pancreatite, por que combinar exames e quadro clínico?","options":["Nenhum teste isolado tem desempenho perfeito em todos os contextos","Porque a imagem substitui a avaliação clínica","Porque amilase confirma todos os casos","Porque sinais clínicos não têm valor"],"correctIndex":0,"explanation":"Diagnóstico costuma integrar sinais, exames laboratoriais específicos e imagem, considerando limitações de sensibilidade e especificidade.","levelStatus":"editorial-triage"},{"id":"grandes-N01","categoryId":"grandes","level":"easy","question":"Qual compartimento do estômago dos ruminantes é conhecido como “pança”?","options":["Rúmen","Retículo","Omaso","Abomaso"],"correctIndex":0,"explanation":"O rúmen é o maior compartimento e abriga microbiota responsável pela fermentação de alimentos fibrosos.","levelStatus":"editorial-triage"},{"id":"grandes-N02","categoryId":"grandes","level":"easy","question":"Qual é a principal função do casco dos equinos?","options":["Proteger estruturas distais e suportar e dissipar forças locomotoras","Produzir leite","Realizar fermentação ruminal","Armazenar bile"],"correctIndex":0,"explanation":"O casco protege estruturas internas e participa do suporte e da mecânica locomotora.","levelStatus":"editorial-triage"},{"id":"grandes-N03","categoryId":"grandes","level":"easy","question":"O que é colostro?","options":["Primeira secreção mamária rica em imunoglobulinas","Leite produzido apenas no fim da lactação","Secreção do rúmen","Líquido amniótico"],"correctIndex":0,"explanation":"O colostro fornece imunoglobulinas e energia ao neonato; em ruminantes, a absorção intestinal é especialmente importante nas primeiras horas.","levelStatus":"editorial-triage"},{"id":"grandes-N04","categoryId":"grandes","level":"easy","question":"Qual espécie é considerada monogástrica?","options":["Equino","Bovino","Ovino","Caprino"],"correctIndex":0,"explanation":"Equinos são herbívoros monogástricos com fermentação importante no intestino grosso.","levelStatus":"editorial-triage"},{"id":"grandes-N05","categoryId":"grandes","level":"medium","question":"Uma vaca no pós-parto apresenta queda de apetite, fraqueza e cálcio sanguíneo baixo. Qual condição é compatível?","options":["Hipocalcemia puerperal","Raiva","Dermatofitose","Tétano"],"correctIndex":0,"explanation":"A hipocalcemia pode ocorrer ao redor do parto e comprometer função neuromuscular; requer avaliação e tratamento veterinário.","levelStatus":"editorial-triage"},{"id":"grandes-N06","categoryId":"grandes","level":"medium","question":"Por que mudanças bruscas na dieta de ruminantes podem ser perigosas?","options":["Podem alterar fermentação ruminal e favorecer distúrbios metabólicos","Porque o rúmen não contém microrganismos","Porque todo concentrado é tóxico","Porque a água interrompe a ruminação"],"correctIndex":0,"explanation":"A microbiota ruminal precisa de adaptação; mudanças abruptas podem favorecer acidose e outros distúrbios digestivos.","levelStatus":"editorial-triage"},{"id":"grandes-N07","categoryId":"grandes","level":"medium","question":"Em equino com cólica, por que a avaliação deve ser rápida?","options":["Algumas causas evoluem para isquemia, necrose ou ruptura intestinal","Toda cólica é autolimitada","A dor não altera parâmetros sistêmicos","O exame retal é sempre dispensável"],"correctIndex":0,"explanation":"Cólica é uma síndrome com causas variadas; algumas são emergências cirúrgicas e podem deteriorar rapidamente.","levelStatus":"editorial-triage"},{"id":"grandes-N08","categoryId":"grandes","level":"hard","question":"Um bezerro não recebeu colostro adequado nas primeiras horas. Qual consequência é mais provável?","options":["Falha de transferência de imunidade passiva","Aumento permanente de imunoglobulinas","Imunidade celular completa ao nascer","Resistência garantida a infecções"],"correctIndex":0,"explanation":"A absorção intestinal de imunoglobulinas cai rapidamente após o nascimento; falha de transferência aumenta risco de doença.","levelStatus":"editorial-triage"},{"id":"grandes-N09","categoryId":"grandes","level":"hard","question":"Em bovino com timpanismo ruminal agudo e distensão importante, qual risco imediato preocupa?","options":["Comprometimento respiratório e circulatório pela distensão","Hipotermia por perda de lã","Obstrução de ducto lacrimal","Fratura de casco"],"correctIndex":0,"explanation":"A distensão do rúmen pode comprimir o diafragma e grandes vasos, causando dificuldade respiratória e colapso.","levelStatus":"editorial-triage"},{"id":"grandes-N10","categoryId":"grandes","level":"hard","question":"Por que a avaliação de claudicação em equinos deve incluir observação dinâmica?","options":["Porque a alteração pode se manifestar ou mudar com movimento e distribuição de carga","Porque inspeção estática sempre localiza a lesão","Porque palpação é proibida","Porque o casco não participa da locomoção"],"correctIndex":0,"explanation":"Exame dinâmico, palpação, pinça de casco e bloqueios diagnósticos podem ajudar a localizar a origem da claudicação.","levelStatus":"editorial-triage"},{"id":"parasito-N01","categoryId":"parasito","level":"easy","question":"Em que grupo de hospedeiros ocorre a reprodução sexuada de Toxoplasma gondii?","options":["Felídeos","Cães","Bovinos","Roedores"],"correctIndex":0,"explanation":"Felídeos são hospedeiros definitivos e eliminam oocistos; outros animais podem atuar como hospedeiros intermediários.","levelStatus":"editorial-triage"},{"id":"parasito-N02","categoryId":"parasito","level":"easy","question":"Qual medida reduz a exposição humana à leptospirose?","options":["Evitar contato desprotegido com água ou lama potencialmente contaminadas por urina","Alimentar animais silvestres","Compartilhar utensílios com roedores","Deixar lixo exposto"],"correctIndex":0,"explanation":"A bactéria pode penetrar por mucosas ou pele lesionada; controle de roedores e proteção em ambientes de risco são importantes.","levelStatus":"editorial-triage"},{"id":"parasito-N03","categoryId":"parasito","level":"easy","question":"Como cães geralmente adquirem Dipylidium caninum?","options":["Ao ingerir pulgas infectadas durante a lambedura","Por picada de mosquito","Pela inalação de ovos","Por contato com água salgada"],"correctIndex":0,"explanation":"A pulga é hospedeiro intermediário; a ingestão acidental durante a higiene permite a infecção.","levelStatus":"editorial-triage"},{"id":"parasito-N04","categoryId":"parasito","level":"easy","question":"Qual é uma medida central no controle de helmintos intestinais?","options":["Plano de diagnóstico e vermifugação orientado pelo risco","Vermifugação diária de todos os animais","Uso de antibiótico preventivo","Suspender limpeza ambiental"],"correctIndex":0,"explanation":"O controle deve considerar espécie, idade, ambiente, exposição e exames; tratamento indiscriminado favorece resistência.","levelStatus":"editorial-triage"},{"id":"parasito-N05","categoryId":"parasito","level":"medium","question":"Um cão com diarreia apresenta Giardia em exame fecal. Qual medida complementar é importante?","options":["Higienizar ambiente e reduzir reexposição a cistos","Suspender água","Tratar apenas o ambiente sem avaliar o animal","Considerar o resultado sempre irrelevante"],"correctIndex":0,"explanation":"A reinfecção ambiental é possível; higiene, remoção de fezes e manejo adequado complementam a abordagem clínica.","levelStatus":"editorial-triage"},{"id":"parasito-N06","categoryId":"parasito","level":"medium","question":"Por que um teste sorológico positivo para leishmaniose deve ser interpretado no contexto?","options":["Porque sorologia indica resposta imune e precisa ser integrada a sinais e critérios diagnósticos","Porque todo positivo prova doença clínica grave","Porque sorologia identifica diretamente o parasita em qualquer tecido","Porque elimina a necessidade de avaliação epidemiológica"],"correctIndex":0,"explanation":"A interpretação depende do teste, prevalência, sinais, confirmação e protocolos oficiais aplicáveis.","levelStatus":"editorial-triage"},{"id":"parasito-N07","categoryId":"parasito","level":"medium","question":"Qual é a principal via de transmissão da raiva para mamíferos?","options":["Inoculação de saliva infectada, geralmente por mordedura","Ingestão de água clorada","Contato com pelos secos","Picada de pulga"],"correctIndex":0,"explanation":"A transmissão ocorre principalmente quando saliva infectada alcança tecidos por mordida ou contato com mucosa/ferida.","levelStatus":"editorial-triage"},{"id":"parasito-N08","categoryId":"parasito","level":"hard","question":"Em área endêmica, cão com exposição a carrapatos e anemia apresenta suspeita de erliquiose. Qual abordagem é mais adequada?","options":["Integrar hemograma, histórico, exame clínico e testes específicos","Confirmar apenas pela presença de carrapatos","Descartar se não houver febre","Usar somente radiografia"],"correctIndex":0,"explanation":"Achados hematológicos e exposição orientam suspeita, mas confirmação e diferenciais exigem testes e contexto.","levelStatus":"editorial-triage"},{"id":"parasito-N09","categoryId":"parasito","level":"hard","question":"Por que o controle de pulgas deve considerar o ambiente e os animais contactantes?","options":["Grande parte do ciclo ambiental ocorre fora do hospedeiro","Pulgas adultas vivem exclusivamente no solo","Ovos e larvas não sobrevivem em ambientes internos","Tratar um animal elimina instantaneamente todas as fases"],"correctIndex":0,"explanation":"Ovos, larvas e pupas podem estar no ambiente; tratar somente o animal pode permitir reinfestação.","levelStatus":"editorial-triage"},{"id":"parasito-N10","categoryId":"parasito","level":"hard","question":"Uma pessoa imunossuprimida convive com gato que usa caixa de areia. Qual orientação reduz risco de toxoplasmose?","options":["Remoção diária das fezes com higiene das mãos e cuidados alimentares","Abandonar o animal","Impedir qualquer contato com o pelo","Dar carne crua ao gato"],"correctIndex":0,"explanation":"Oocistos precisam de tempo para esporular; limpeza diária, higiene e evitar carne crua reduzem exposição sem exigir abandono.","levelStatus":"editorial-triage"},{"id":"reproducao-N01","categoryId":"reproducao","level":"easy","question":"Qual hormônio está associado à manutenção do corpo lúteo e da gestação na cadela?","options":["Progesterona","Insulina","Tiroxina","Adrenalina"],"correctIndex":0,"explanation":"A progesterona produzida pelo corpo lúteo é essencial para a manutenção da gestação canina.","levelStatus":"editorial-triage"},{"id":"reproducao-N02","categoryId":"reproducao","level":"easy","question":"O que é distocia?","options":["Dificuldade ou impossibilidade de progressão normal do parto","Ausência de cio","Inflamação da glândula mamária","Retenção urinária"],"correctIndex":0,"explanation":"Distocia é parto difícil e pode decorrer de causas maternas ou fetais, exigindo avaliação rápida.","levelStatus":"editorial-triage"},{"id":"reproducao-N03","categoryId":"reproducao","level":"easy","question":"Qual estrutura conecta o feto à placenta?","options":["Cordão umbilical","Cérvix","Ovário","Endométrio"],"correctIndex":0,"explanation":"O cordão umbilical contém vasos que conectam a circulação fetal à placenta.","levelStatus":"editorial-triage"},{"id":"reproducao-N04","categoryId":"reproducao","level":"easy","question":"Qual exame é frequentemente usado para confirmar gestação em cadelas?","options":["Ultrassonografia","Eletrocardiograma","Raspado cutâneo","Coproparasitológico"],"correctIndex":0,"explanation":"A ultrassonografia permite identificar estruturas gestacionais e avaliar viabilidade em momento apropriado.","levelStatus":"editorial-triage"},{"id":"reproducao-N05","categoryId":"reproducao","level":"medium","question":"Uma cadela apresenta contrações fortes sem nascimento de filhote por período preocupante. Qual conduta é indicada?","options":["Avaliação veterinária imediata para investigar distocia","Aguardar indefinidamente","Administrar ocitocina sem avaliação","Interromper a observação"],"correctIndex":0,"explanation":"Contrações improdutivas podem indicar obstrução ou inércia; ocitocina sem excluir obstrução pode ser perigosa.","levelStatus":"editorial-triage"},{"id":"reproducao-N06","categoryId":"reproducao","level":"medium","question":"Por que a data de cobertura não estima com precisão absoluta o dia do parto em cadelas?","options":["Porque o momento da ovulação pode diferir da data de acasalamento","Porque a gestação dura sempre 90 dias","Porque a fecundação ocorre antes do cio","Porque a duração não tem variação"],"correctIndex":0,"explanation":"A duração medida a partir da ovulação é mais consistente; espermatozoides podem sobreviver e a cobertura não marca ovulação.","levelStatus":"editorial-triage"},{"id":"reproducao-N07","categoryId":"reproducao","level":"medium","question":"Qual é a função principal da placenta?","options":["Realizar trocas de gases, nutrientes e resíduos entre mãe e feto","Produzir urina fetal","Substituir o sistema respiratório materno","Impedir toda passagem de substâncias"],"correctIndex":0,"explanation":"A placenta realiza trocas materno-fetais e também tem funções endócrinas; não é barreira absoluta.","levelStatus":"editorial-triage"},{"id":"reproducao-N08","categoryId":"reproducao","level":"hard","question":"Uma cadela apresenta secreção vaginal purulenta semanas após o cio, apatia e aumento de sede. Qual condição deve ser considerada?","options":["Piometra","Vaginite fisiológica obrigatória","Gestação normal confirmada","Cistite simples como única hipótese"],"correctIndex":0,"explanation":"Piometra é infecção uterina potencialmente grave, associada à fase lútea; sinais sistêmicos exigem atendimento urgente.","levelStatus":"editorial-triage"},{"id":"reproducao-N09","categoryId":"reproducao","level":"hard","question":"Por que a avaliação do sêmen não deve se limitar à motilidade?","options":["Concentração, morfologia, viabilidade e integridade também influenciam fertilidade","Motilidade não tem qualquer relação com fertilidade","A cor do sêmen define fertilidade","Volume isolado confirma capacidade fecundante"],"correctIndex":0,"explanation":"A fertilidade depende de múltiplos parâmetros seminais e também de fatores do macho, fêmea e manejo.","levelStatus":"editorial-triage"},{"id":"reproducao-N10","categoryId":"reproducao","level":"hard","question":"Em gata, o fotoperíodo influencia a atividade reprodutiva. O que isso significa?","options":["A duração da luz pode modular a sazonalidade dos ciclos","A ovulação ocorre diariamente em qualquer condição","A espécie não apresenta sazonalidade","A gestação depende exclusivamente da temperatura"],"correctIndex":0,"explanation":"Gatas são poliéstricas sazonais de dias longos em muitas condições; luz artificial e latitude também influenciam.","levelStatus":"editorial-triage"},{"id":"nutricao-N01","categoryId":"nutricao","level":"easy","question":"Qual nutriente é a principal fonte de energia rapidamente disponível na dieta?","options":["Carboidratos","Vitaminas","Minerais","Água"],"correctIndex":0,"explanation":"Carboidratos fornecem energia, embora gorduras e proteínas também possam contribuir conforme a dieta e o metabolismo.","levelStatus":"editorial-triage"},{"id":"nutricao-N02","categoryId":"nutricao","level":"easy","question":"Por que a água deve estar sempre disponível aos animais?","options":["É essencial à hidratação, metabolismo e regulação térmica","Substitui todos os minerais","Fornece proteína completa","Impede qualquer doença renal"],"correctIndex":0,"explanation":"Água é indispensável para funções fisiológicas; necessidade varia com espécie, dieta, ambiente e saúde.","levelStatus":"editorial-triage"},{"id":"nutricao-N03","categoryId":"nutricao","level":"easy","question":"Qual nutriente fornece aminoácidos para síntese e reparo de tecidos?","options":["Proteína","Fibra insolúvel","Água","Sódio isolado"],"correctIndex":0,"explanation":"Proteínas são fontes de aminoácidos usados na construção e manutenção de tecidos e moléculas funcionais.","levelStatus":"editorial-triage"},{"id":"nutricao-N04","categoryId":"nutricao","level":"easy","question":"Qual prática ajuda a prevenir desconforto gastrointestinal ao trocar a ração?","options":["Fazer transição gradual, conforme tolerância e orientação","Trocar toda a dieta abruptamente","Reduzir água durante a troca","Misturar alimentos estragados"],"correctIndex":0,"explanation":"Transição gradual pode facilitar adaptação digestiva, embora a velocidade dependa do paciente e da dieta.","levelStatus":"editorial-triage"},{"id":"nutricao-N05","categoryId":"nutricao","level":"medium","question":"Um filhote de raça grande recebe suplemento de cálcio sem indicação. Qual é o risco?","options":["Desequilíbrio mineral e alterações no desenvolvimento esquelético","Prevenção garantida de displasia","Crescimento ósseo sempre mais saudável","Ausência de qualquer efeito"],"correctIndex":0,"explanation":"Excesso de cálcio pode prejudicar a regulação mineral e o desenvolvimento de filhotes de raças grandes.","levelStatus":"editorial-triage"},{"id":"nutricao-N06","categoryId":"nutricao","level":"medium","question":"Por que a condição corporal é útil na avaliação nutricional?","options":["Ajuda a estimar reservas de gordura e orientar ajustes alimentares","Substitui pesagem e exame clínico","Mede diretamente massa muscular","Confirma deficiência vitamínica específica"],"correctIndex":0,"explanation":"Escore corporal complementa peso e avaliação muscular, permitindo acompanhar tendências e adequar energia.","levelStatus":"editorial-triage"},{"id":"nutricao-N07","categoryId":"nutricao","level":"medium","question":"Qual é o papel da fibra na dieta de cães e gatos?","options":["Pode influenciar trânsito intestinal, consistência fecal e saciedade","É sempre indigerível e sem função","Substitui aminoácidos essenciais","Elimina necessidade de água"],"correctIndex":0,"explanation":"Tipos e quantidades de fibra têm efeitos distintos na microbiota, trânsito e controle de peso.","levelStatus":"editorial-triage"},{"id":"nutricao-N08","categoryId":"nutricao","level":"hard","question":"Gato alimentado com dieta caseira sem formulação apresenta risco de deficiência de taurina. Por quê?","options":["Gatos têm exigência dietética específica de taurina e não sintetizam o suficiente","Taurina é produzida em excesso por todos os gatos","Taurina só existe em vegetais","A deficiência afeta apenas a pelagem"],"correctIndex":0,"explanation":"Taurina é essencial para gatos; deficiência pode causar alterações cardíacas, retinianas e reprodutivas.","levelStatus":"editorial-triage"},{"id":"nutricao-N09","categoryId":"nutricao","level":"hard","question":"Um animal obeso perde peso muito rapidamente durante dieta restritiva. Qual preocupação existe em gatos?","options":["Risco de lipidose hepática associado à mobilização intensa de gordura","Aumento garantido da massa muscular","Proteção contra doenças metabólicas","Ausência de risco se houver água"],"correctIndex":0,"explanation":"Em gatos, perda de peso rápida e anorexia podem precipitar lipidose hepática; o plano deve ser gradual e monitorado.","levelStatus":"editorial-triage"},{"id":"nutricao-N10","categoryId":"nutricao","level":"hard","question":"Por que uma dieta terapêutica renal não deve ser escolhida apenas porque a creatinina está elevada?","options":["É necessário confirmar estágio, contexto clínico, ingestão e necessidades individuais","Toda elevação de creatinina exige a mesma dieta","A dieta renal é indicada a qualquer espécie","A creatinina não tem relação com rins"],"correctIndex":0,"explanation":"A escolha nutricional depende do diagnóstico, estágio, fósforo, condição corporal, apetite e comorbidades.","levelStatus":"editorial-triage"},{"id":"silvestres-N01","categoryId":"silvestres","level":"easy","question":"Qual característica ajuda a diferenciar aves de mamíferos na ventilação?","options":["Presença de sacos aéreos e fluxo respiratório especializado","Presença de diafragma muscular","Pulmões expansíveis como os de cães","Ausência de traqueia"],"correctIndex":0,"explanation":"Aves possuem pulmões relativamente rígidos e sacos aéreos que participam da ventilação unidirecional.","levelStatus":"editorial-triage"},{"id":"silvestres-N02","categoryId":"silvestres","level":"easy","question":"Qual é a função do enriquecimento ambiental?","options":["Estimular comportamentos naturais e reduzir monotonia","Substituir alimentação balanceada","Eliminar necessidade de espaço","Impedir todo comportamento exploratório"],"correctIndex":0,"explanation":"Enriquecimento oferece oportunidades de exploração, busca de alimento, abrigo e outros comportamentos espécie-específicos.","levelStatus":"editorial-triage"},{"id":"silvestres-N03","categoryId":"silvestres","level":"easy","question":"Répteis são ectotérmicos. O que isso significa?","options":["Dependem de fontes externas para regular a temperatura corporal","Mantêm temperatura constante por produção interna intensa","Não sofrem influência da temperatura ambiental","Não precisam de gradiente térmico"],"correctIndex":0,"explanation":"Répteis usam fontes externas de calor e precisam de gradientes ambientais adequados à espécie.","levelStatus":"editorial-triage"},{"id":"silvestres-N04","categoryId":"silvestres","level":"easy","question":"Qual cuidado é essencial antes de oferecer alimento a um animal silvestre resgatado?","options":["Identificar espécie, condição clínica e necessidades nutricionais","Oferecer qualquer alimento disponível","Forçar alimentação em todos os casos","Usar dieta exclusiva de cães"],"correctIndex":0,"explanation":"Dieta inadequada e alimentação forçada podem causar danos; espécie, estado clínico e orientação especializada são fundamentais.","levelStatus":"editorial-triage"},{"id":"silvestres-N05","categoryId":"silvestres","level":"medium","question":"Uma ave apresenta respiração de bico aberto e movimento intenso da cauda. Qual é a prioridade?","options":["Reduzir estresse e buscar avaliação veterinária urgente","Realizar contenção prolongada para fotografias","Forçar alimentação imediatamente","Aguardar vários dias"],"correctIndex":0,"explanation":"Sinais de esforço respiratório em aves podem indicar emergência; manipulação deve ser minimizada.","levelStatus":"editorial-triage"},{"id":"silvestres-N06","categoryId":"silvestres","level":"medium","question":"Por que a contenção química em animais silvestres exige planejamento?","options":["Espécie, estado fisiológico, ambiente e risco anestésico variam amplamente","Todos respondem igualmente aos mesmos fármacos","A contenção química elimina monitorização","O peso não influencia dose"],"correctIndex":0,"explanation":"Protocolos devem ser individualizados e considerar riscos de estresse, hipertermia, hipotermia e depressão cardiorrespiratória.","levelStatus":"editorial-triage"},{"id":"silvestres-N07","categoryId":"silvestres","level":"medium","question":"Qual risco zoonótico é associado ao manejo de répteis?","options":["Exposição a Salmonella por contato com animal ou ambiente contaminado","Transmissão obrigatória de raiva por escamas","Leishmaniose por mordida de tartaruga","Toxoplasmose por penas"],"correctIndex":0,"explanation":"Répteis podem portar Salmonella sem sinais; higiene das mãos e limpeza segura reduzem o risco.","levelStatus":"editorial-triage"},{"id":"silvestres-N08","categoryId":"silvestres","level":"hard","question":"Um papagaio em cativeiro desenvolve arrancamento de penas. Qual abordagem é mais adequada?","options":["Investigar causas médicas, ambientais, nutricionais e comportamentais","Classificar automaticamente como tédio","Punir o animal para interromper o comportamento","Prescrever sedativo sem exame"],"correctIndex":0,"explanation":"Arrancamento de penas é multifatorial; avaliação clínica e revisão de manejo são necessárias antes de concluir causa comportamental.","levelStatus":"editorial-triage"},{"id":"silvestres-N09","categoryId":"silvestres","level":"hard","question":"Por que a temperatura ambiental inadequada é especialmente relevante em répteis doentes?","options":["Pode alterar metabolismo, digestão, imunidade e resposta a tratamentos","A temperatura não influencia répteis","Aumentar calor sempre resolve qualquer doença","O animal regula internamente sem limite"],"correctIndex":0,"explanation":"A faixa térmica ótima depende da espécie e influencia processos fisiológicos; extremos também causam danos.","levelStatus":"editorial-triage"},{"id":"silvestres-N10","categoryId":"silvestres","level":"hard","question":"Ao receber animal silvestre de origem desconhecida, qual é uma conduta ética e técnica importante?","options":["Registrar procedência, minimizar manipulação e acionar órgão/serviço autorizado","Manter permanentemente como animal doméstico","Soltar em qualquer área verde","Realizar procedimentos sem documentação"],"correctIndex":0,"explanation":"Origem e destino precisam ser documentados; encaminhamento deve respeitar regras ambientais e avaliação de saúde.","levelStatus":"editorial-triage"},{"id":"dermato-N01","categoryId":"dermato","level":"easy","question":"Qual sinal define prurido?","options":["Coçar, lamber ou morder a pele em resposta à coceira","Perda de apetite","Aumento da sede","Dificuldade respiratória"],"correctIndex":0,"explanation":"Prurido é sensação que leva a comportamentos como coçar e lamber, podendo ter causas dermatológicas ou sistêmicas.","levelStatus":"editorial-triage"},{"id":"dermato-N02","categoryId":"dermato","level":"easy","question":"Qual agente é frequentemente associado à dermatofitose em gatos?","options":["Microsporum canis","Ehrlichia canis","Giardia duodenalis","Dirofilaria immitis"],"correctIndex":0,"explanation":"Microsporum canis é um dermatófito comum em gatos e pode infectar pessoas.","levelStatus":"editorial-triage"},{"id":"dermato-N03","categoryId":"dermato","level":"easy","question":"O que é alopecia?","options":["Perda de pelos","Aumento da pigmentação","Inflamação do ouvido médio","Espessamento das unhas"],"correctIndex":0,"explanation":"Alopecia descreve perda parcial ou total de pelos e tem diversas causas.","levelStatus":"editorial-triage"},{"id":"dermato-N04","categoryId":"dermato","level":"easy","question":"Na avaliação de secreção auricular, qual técnica permite observar leveduras e bactérias ao microscópio?","options":["Citologia do conduto auditivo","Radiografia abdominal","Eletrocardiograma","Teste de glicemia"],"correctIndex":0,"explanation":"Citologia identifica leveduras, bactérias e células inflamatórias e ajuda a orientar o tratamento.","levelStatus":"editorial-triage"},{"id":"dermato-N05","categoryId":"dermato","level":"medium","question":"Um cão apresenta prurido intenso e pulgas visíveis. Qual hipótese deve ser considerada?","options":["Dermatite alérgica à picada de pulgas","Demodicose confirmada","Hipotireoidismo confirmado","Dermatofitose obrigatória"],"correctIndex":0,"explanation":"A saliva da pulga pode desencadear hipersensibilidade; a presença de pulgas e distribuição das lesões orientam a investigação.","levelStatus":"editorial-triage"},{"id":"dermato-N06","categoryId":"dermato","level":"medium","question":"Por que tratar apenas a infecção bacteriana recorrente pode falhar?","options":["Uma doença de base, como alergia ou parasitismo, pode permanecer ativa","Bactérias nunca causam lesões cutâneas","Antibióticos não atuam na pele","A pele não possui microbiota"],"correctIndex":0,"explanation":"Piodermites podem ser secundárias; identificar e controlar a causa primária reduz recorrências.","levelStatus":"editorial-triage"},{"id":"dermato-N07","categoryId":"dermato","level":"medium","question":"Qual cuidado é importante antes de aplicar produto otológico?","options":["Verificar condição do tímpano e escolher produto apropriado","Usar qualquer solução doméstica","Introduzir cotonete profundamente","Aplicar álcool em ouvido dolorido"],"correctIndex":0,"explanation":"Alguns produtos podem ser ototóxicos se houver ruptura timpânica; dor e secreção requerem exame.","levelStatus":"editorial-triage"},{"id":"dermato-N08","categoryId":"dermato","level":"hard","question":"Um raspado superficial negativo não exclui demodicose em todos os casos. Qual é a razão?","options":["Ácaros podem estar em folículos profundos e exigir técnica de coleta adequada","Demodex vive apenas no sangue","O exame detecta apenas fungos","O ácaro é invisível a qualquer microscópio"],"correctIndex":0,"explanation":"A profundidade e técnica do raspado importam; tricograma ou biópsia podem ser considerados em situações selecionadas.","levelStatus":"editorial-triage"},{"id":"dermato-N09","categoryId":"dermato","level":"hard","question":"Lesões circulares com alopecia e descamação em pessoa e gato sugerem qual preocupação?","options":["Dermatofitose zoonótica","Doença exclusivamente autoimune","Sarna demodécica humana obrigatória","Dermatite por contato não transmissível"],"correctIndex":0,"explanation":"Dermatófitos podem infectar animais e pessoas; confirmação laboratorial e higiene ajudam no controle.","levelStatus":"editorial-triage"},{"id":"dermato-N10","categoryId":"dermato","level":"hard","question":"Um cão com otite recorrente apresenta citologia com muitos cocos e leveduras. Qual estratégia é mais apropriada?","options":["Tratar conforme citologia e investigar fatores predisponentes e causas primárias","Usar o mesmo antibiótico indefinidamente","Limpar agressivamente sem examinar o tímpano","Ignorar a recorrência"],"correctIndex":0,"explanation":"Citologia orienta a terapia, enquanto alergias, conformação, umidade e outras causas devem ser investigadas.","levelStatus":"editorial-triage"},{"id":"clinica-N11","categoryId":"clinica","level":"easy","question":"Qual alteração é chamada de poliúria?","options":["Aumento do volume urinário","Aumento da frequência cardíaca","Diminuição do apetite","Ausência de defecação"],"correctIndex":0,"explanation":"Poliúria descreve aumento do volume de urina; deve ser diferenciada de polaciúria, que é aumento da frequência de micções.","levelStatus":"editorial-triage"},{"id":"clinica-N12","categoryId":"clinica","level":"easy","question":"Polidipsia significa:","options":["Aumento da ingestão de água","Aumento do volume fecal","Dificuldade para engolir","Redução da produção de urina"],"correctIndex":0,"explanation":"Polidipsia é aumento da sede e frequentemente acompanha poliúria em doenças metabólicas ou renais.","levelStatus":"editorial-triage"},{"id":"clinica-N13","categoryId":"clinica","level":"easy","question":"Qual achado é mais diretamente avaliado pela palpação dos pulsos periféricos?","options":["Qualidade e amplitude do pulso arterial","Concentração de glicose","Densidade óssea","Atividade elétrica cerebral"],"correctIndex":0,"explanation":"A palpação do pulso fornece informação sobre frequência, ritmo e amplitude, devendo ser comparada à ausculta cardíaca.","levelStatus":"editorial-triage"},{"id":"clinica-N14","categoryId":"clinica","level":"easy","question":"O termo hematêmese indica:","options":["Vômito com sangue","Sangue nas fezes","Sangue na urina","Sangramento nasal"],"correctIndex":0,"explanation":"Hematêmese é a presença de sangue no vômito e exige investigação da origem e gravidade.","levelStatus":"editorial-triage"},{"id":"clinica-N15","categoryId":"clinica","level":"easy","question":"Qual sinal é compatível com hipoglicemia importante?","options":["Fraqueza, tremores ou alteração de consciência","Aumento isolado do comprimento das unhas","Prurido auricular","Crescimento acelerado dos pelos"],"correctIndex":0,"explanation":"A glicose é essencial ao sistema nervoso; quedas importantes podem causar sinais neurológicos e fraqueza.","levelStatus":"editorial-triage"},{"id":"clinica-N16","categoryId":"clinica","level":"easy","question":"O que é bradicardia?","options":["Frequência cardíaca abaixo do esperado para o contexto","Frequência respiratória elevada","Pressão arterial sempre alta","Ausência de pulso venoso"],"correctIndex":0,"explanation":"Bradicardia significa frequência cardíaca reduzida, cuja relevância depende da espécie, porte, estado e ritmo.","levelStatus":"editorial-triage"},{"id":"clinica-N17","categoryId":"clinica","level":"medium","question":"Cão com vômitos, dor abdominal e distensão progressiva: qual atitude é mais segura?","options":["Encaminhar para avaliação urgente, sem tentar alimentação ou medicação caseira","Induzir vômito em casa","Oferecer grande refeição","Aguardar uma semana"],"correctIndex":0,"explanation":"Dor e distensão podem indicar emergências como dilatação-vólvulo; avaliação rápida é prioritária.","levelStatus":"editorial-triage"},{"id":"clinica-N18","categoryId":"clinica","level":"medium","question":"Um paciente apresenta mucosas pálidas, pulso fraco e extremidades frias. Qual preocupação deve ser priorizada?","options":["Perfusão inadequada/choque","Dermatite alérgica","Otite externa","Obesidade"],"correctIndex":0,"explanation":"O conjunto sugere comprometimento circulatório; a causa e a gravidade precisam ser avaliadas imediatamente.","levelStatus":"editorial-triage"},{"id":"clinica-N19","categoryId":"clinica","level":"medium","question":"Por que a pressão arterial deve ser medida com manguito adequado?","options":["Largura inadequada pode distorcer a estimativa da pressão","O tamanho não interfere no resultado","Manguitos maiores sempre medem temperatura","A pressão só pode ser medida com estetoscópio"],"correctIndex":0,"explanation":"Manguito muito estreito tende a superestimar e muito largo pode subestimar a pressão.","levelStatus":"editorial-triage"},{"id":"clinica-N20","categoryId":"clinica","level":"medium","question":"Cão com tosse, síncope ao exercício e sopro. Qual exame pode caracterizar estrutura e função cardíaca?","options":["Ecocardiograma","Coproparasitológico","Raspado cutâneo","Teste de fluoresceína"],"correctIndex":0,"explanation":"O ecocardiograma avalia anatomia e função cardíaca; a investigação pode incluir radiografias e ECG conforme o caso.","levelStatus":"editorial-triage"},{"id":"clinica-N21","categoryId":"clinica","level":"medium","question":"Em um gato com doença renal suspeita, por que avaliar a densidade urinária junto à creatinina?","options":["Ajuda a interpretar a capacidade de concentração renal e o contexto da azotemia","Substitui todos os exames de imagem","Confirma infecção urinária isoladamente","Determina a idade do animal"],"correctIndex":0,"explanation":"A densidade urinária contextualiza a azotemia e a capacidade de concentração, mas deve ser integrada a outros achados.","levelStatus":"editorial-triage"},{"id":"clinica-N22","categoryId":"clinica","level":"medium","question":"Um cão diabético apresenta fraqueza, vômitos e desidratação. Qual complicação deve ser investigada?","options":["Cetoacidose diabética","Dermatofitose","Luxação patelar","Otite por leveduras"],"correctIndex":0,"explanation":"Cetoacidose pode cursar com desidratação, vômitos, alterações metabólicas e requer atendimento emergencial.","levelStatus":"editorial-triage"},{"id":"clinica-N23","categoryId":"clinica","level":"medium","question":"Qual interpretação é correta para leucocitose em um hemograma?","options":["É um achado inespecífico que precisa ser interpretado com diferencial e clínica","Confirma infecção bacteriana em qualquer situação","Exclui inflamação","Diagnostica câncer por si só"],"correctIndex":0,"explanation":"Leucocitose pode ocorrer em inflamação, estresse, corticosteroides e outras condições; não fecha diagnóstico isoladamente.","levelStatus":"editorial-triage"},{"id":"clinica-N24","categoryId":"clinica","level":"hard","question":"Paciente com anemia regenerativa e icterícia: qual mecanismo deve ser considerado?","options":["Hemólise, entre outras causas possíveis de anemia regenerativa","Deficiência exclusiva de plaquetas","Hipertireoidismo obrigatório","Obstrução intestinal confirmada"],"correctIndex":0,"explanation":"Hemólise pode causar anemia regenerativa e aumento de bilirrubina, mas precisa de confirmação laboratorial.","levelStatus":"editorial-triage"},{"id":"clinica-N25","categoryId":"clinica","level":"hard","question":"Por que a avaliação seriada de lactato pode ser útil em pacientes críticos?","options":["A tendência pode ajudar a acompanhar perfusão e resposta à estabilização","Um valor isolado identifica sempre a causa","Lactato mede diretamente a função renal","Substitui exame físico"],"correctIndex":0,"explanation":"A evolução do lactato pode complementar a avaliação de perfusão, sem ser interpretada isoladamente.","levelStatus":"editorial-triage"},{"id":"clinica-N26","categoryId":"clinica","level":"hard","question":"Em paciente com dispneia, por que radiografias podem ser adiadas até estabilização?","options":["O posicionamento e a contenção podem agravar o desconforto respiratório","Radiografias são sempre contraindicadas","A imagem não fornece informação torácica","A estabilização não tem relevância"],"correctIndex":0,"explanation":"Em pacientes instáveis, manipulação e posicionamento podem aumentar o esforço respiratório; estabilizar vem primeiro.","levelStatus":"editorial-triage"},{"id":"clinica-N27","categoryId":"clinica","level":"hard","question":"Cão com febre, claudicação migratória e dor articular. Qual abordagem evita conclusão precipitada?","options":["Investigar causas infecciosas, imunomediadas e outras com histórico e exames direcionados","Diagnosticar osteoartrite apenas pela febre","Prescrever antibiótico sem coleta ou avaliação","Descartar doença sistêmica"],"correctIndex":0,"explanation":"Poliartrite e claudicação têm diagnósticos diferenciais amplos; exame articular e testes selecionados orientam a investigação.","levelStatus":"editorial-triage"},{"id":"clinica-N28","categoryId":"clinica","level":"hard","question":"Qual é a limitação de usar apenas a temperatura para definir gravidade de um paciente?","options":["A temperatura isolada não representa perfusão, oxigenação ou estado neurológico","Temperatura nunca varia","Febre confirma sepse","Normotermia exclui doença grave"],"correctIndex":0,"explanation":"A gravidade é multifatorial e exige avaliação de sinais vitais, perfusão, consciência e exames pertinentes.","levelStatus":"editorial-triage"},{"id":"clinica-N29","categoryId":"clinica","level":"hard","question":"Um animal com ascite apresenta albumina baixa. Qual relação fisiopatológica pode contribuir?","options":["Redução da pressão oncótica plasmática","Aumento da pressão sonora","Aumento da densidade óssea","Bloqueio da condução nervosa"],"correctIndex":0,"explanation":"Hipoalbuminemia pode reduzir pressão oncótica, mas ascite também pode decorrer de hipertensão portal e outras causas.","levelStatus":"editorial-triage"},{"id":"clinica-N30","categoryId":"clinica","level":"hard","question":"Por que uma resposta favorável a um medicamento não confirma, sozinha, o diagnóstico?","options":["A resposta terapêutica pode ser inespecífica e ocorrer em diferentes doenças","Todo fármaco age em uma única doença","A melhora exclui efeitos placebo","A resposta substitui exames em todos os casos"],"correctIndex":0,"explanation":"Resposta terapêutica é uma evidência possível, mas deve ser combinada com história, exame e testes diagnósticos.","levelStatus":"editorial-triage"},{"id":"cirurgia-N11","categoryId":"cirurgia","level":"easy","question":"O que é laparotomia?","options":["Abertura cirúrgica da cavidade abdominal","Retirada do baço","Sutura de tendão","Exame radiográfico do abdome"],"correctIndex":0,"explanation":"Laparotomia é a abertura cirúrgica do abdome; celiotomia é termo relacionado usado para incisão na cavidade abdominal.","levelStatus":"editorial-triage"},{"id":"cirurgia-N12","categoryId":"cirurgia","level":"easy","question":"Qual é a finalidade da hemostasia?","options":["Controlar o sangramento","Promover anestesia geral","Remover pelos","Estimular a diurese"],"correctIndex":0,"explanation":"Hemostasia reúne medidas para controlar sangramento e manter campo operatório e estabilidade do paciente.","levelStatus":"editorial-triage"},{"id":"cirurgia-N13","categoryId":"cirurgia","level":"easy","question":"Qual material é apropriado para fechamento de pele em muitos procedimentos?","options":["Fio ou grampo selecionado conforme tensão, local e paciente","Qualquer fio absorvível sem avaliação","Fita adesiva doméstica em toda ferida","Material não esterilizado"],"correctIndex":0,"explanation":"A escolha depende de tensão, tecido, contaminação e plano; não existe material universal.","levelStatus":"editorial-triage"},{"id":"cirurgia-N14","categoryId":"cirurgia","level":"easy","question":"O que caracteriza uma cirurgia limpa-contaminada?","options":["Entrada controlada em trato colonizado sem contaminação incomum","Presença obrigatória de pus","Ferida traumática antiga com tecido desvitalizado","Procedimento sem incisão"],"correctIndex":0,"explanation":"A classificação considera o grau de contaminação e a entrada controlada em tratos colonizados.","levelStatus":"editorial-triage"},{"id":"cirurgia-N15","categoryId":"cirurgia","level":"easy","question":"Por que a tricotomia deve ser feita próximo ao procedimento?","options":["Para reduzir microlesões e proliferação microbiana associadas à remoção precoce","Para aumentar o crescimento do pelo","Para dispensar antissepsia","Para esterilizar a pele"],"correctIndex":0,"explanation":"Remoção muito antecipada pode favorecer microtraumas e colonização; técnica e momento são importantes.","levelStatus":"editorial-triage"},{"id":"cirurgia-N16","categoryId":"cirurgia","level":"easy","question":"Qual é a função de um afastador cirúrgico?","options":["Manter tecidos afastados para melhorar a exposição do campo","Cortar osso","Medir pressão arterial","Administrar fluidos"],"correctIndex":0,"explanation":"Afastadores promovem exposição e acesso ao campo operatório, com cuidado para evitar lesão por pressão.","levelStatus":"editorial-triage"},{"id":"cirurgia-N17","categoryId":"cirurgia","level":"medium","question":"Após cirurgia abdominal, o paciente apresenta dor crescente, distensão e prostração. Qual conduta é indicada?","options":["Reavaliação veterinária imediata para investigar complicações","Aumentar exercício","Retirar pontos em casa","Suspender água por vários dias"],"correctIndex":0,"explanation":"Dor e distensão progressivas podem indicar complicações e exigem reavaliação rápida.","levelStatus":"editorial-triage"},{"id":"cirurgia-N18","categoryId":"cirurgia","level":"medium","question":"Por que a antibioticoprofilaxia não substitui a técnica asséptica?","options":["Antibióticos não compensam falhas de assepsia e não eliminam todas as fontes de contaminação","Antibióticos esterilizam o campo","A profilaxia torna luvas dispensáveis","A técnica asséptica serve apenas em cirurgias longas"],"correctIndex":0,"explanation":"Profilaxia é medida complementar, indicada conforme risco e procedimento, nunca substituta da assepsia.","levelStatus":"editorial-triage"},{"id":"cirurgia-N19","categoryId":"cirurgia","level":"medium","question":"Em uma ferida com tecido desvitalizado e contaminação, qual princípio pode ser necessário?","options":["Desbridamento criterioso e manejo da contaminação","Fechamento sob tensão sem limpeza","Aplicação de pó doméstico","Oclusão imediata em qualquer condição"],"correctIndex":0,"explanation":"Desbridamento remove tecido inviável; fechamento depende da viabilidade, contaminação e possibilidade de controle da infecção.","levelStatus":"editorial-triage"},{"id":"cirurgia-N20","categoryId":"cirurgia","level":"medium","question":"Qual fator aumenta o risco de deiscência abdominal?","options":["Tensão excessiva, infecção ou técnica inadequada de fechamento","Analgesia adequada","Monitoramento frequente","Controle de temperatura"],"correctIndex":0,"explanation":"A integridade da parede depende de técnica, tensão, perfusão, infecção e condições sistêmicas.","levelStatus":"editorial-triage"},{"id":"cirurgia-N21","categoryId":"cirurgia","level":"medium","question":"Em suspeita de hemorragia interna após trauma, qual abordagem é prioritária?","options":["Avaliar e estabilizar circulação enquanto se localiza a fonte do sangramento","Fazer curativo superficial apenas","Oferecer alimento","Aguardar sinais externos"],"correctIndex":0,"explanation":"Hemorragia interna pode não ser visível; avaliação circulatória e estabilização são urgentes.","levelStatus":"editorial-triage"},{"id":"cirurgia-N22","categoryId":"cirurgia","level":"medium","question":"Qual é a vantagem de fechar uma ferida por segunda intenção em casos selecionados?","options":["Permitir drenagem e granulação quando fechamento primário não é adequado","Garantir cicatriz sem acompanhamento","Impedir formação de tecido de granulação","Eliminar a necessidade de limpeza"],"correctIndex":0,"explanation":"Feridas contaminadas ou com perda tecidual podem cicatrizar abertas, com manejo e reavaliações.","levelStatus":"editorial-triage"},{"id":"cirurgia-N23","categoryId":"cirurgia","level":"medium","question":"Em cirurgia oncológica, por que o planejamento das margens é importante?","options":["Para aumentar a chance de excisão completa conforme tipo tumoral e localização","Para dispensar histopatologia","Para evitar avaliação de linfonodos em todos os casos","Para garantir que todo tumor seja benigno"],"correctIndex":0,"explanation":"Margens adequadas variam com tumor, grau e região; histopatologia avalia margens e orienta condutas.","levelStatus":"editorial-triage"},{"id":"cirurgia-N24","categoryId":"cirurgia","level":"hard","question":"Qual é o papel da histopatologia após remoção de uma massa?","options":["Caracterizar o tecido e, frequentemente, o tipo tumoral e margens","Medir diretamente a pressão arterial","Identificar ritmo cardíaco","Determinar glicemia"],"correctIndex":0,"explanation":"A análise histopatológica permite diagnóstico tecidual e pode informar comportamento e margens da excisão.","levelStatus":"editorial-triage"},{"id":"cirurgia-N25","categoryId":"cirurgia","level":"hard","question":"Durante a cirurgia, hipotermia pode contribuir para:","options":["Alterações de coagulação e recuperação anestésica mais lenta","Aumento obrigatório da imunidade","Cicatrização instantânea","Ausência de dor"],"correctIndex":0,"explanation":"Hipotermia perioperatória pode prejudicar coagulação, metabolismo de fármacos e recuperação.","levelStatus":"editorial-triage"},{"id":"cirurgia-N26","categoryId":"cirurgia","level":"hard","question":"Por que a posição cirúrgica precisa ser cuidadosamente planejada?","options":["Pode afetar ventilação, perfusão e risco de lesões por pressão ou nervos","Não interfere no paciente anestesiado","Serve apenas para fotografia","Determina o tipo de fio"],"correctIndex":0,"explanation":"Posicionamento inadequado pode comprometer ventilação e circulação e causar lesões musculoesqueléticas ou nervosas.","levelStatus":"editorial-triage"},{"id":"cirurgia-N27","categoryId":"cirurgia","level":"hard","question":"Uma incisão apresenta secreção purulenta e calor local. Qual interpretação é mais adequada?","options":["Há suspeita de infecção do sítio cirúrgico e necessidade de avaliação","É sempre cicatrização normal","Confirma alergia ao fio","Exclui complicação profunda"],"correctIndex":0,"explanation":"Secreção purulenta e calor são sinais preocupantes; extensão e agente precisam ser avaliados.","levelStatus":"editorial-triage"},{"id":"cirurgia-N28","categoryId":"cirurgia","level":"hard","question":"Qual medida reduz risco de hipotermia durante procedimentos longos?","options":["Monitorar temperatura e usar aquecimento seguro e controlado","Aplicar calor intenso diretamente sem controle","Evitar monitorização","Manter paciente molhado"],"correctIndex":0,"explanation":"Aquecimento ativo monitorado e prevenção de perda de calor são medidas importantes, evitando queimaduras.","levelStatus":"editorial-triage"},{"id":"cirurgia-N29","categoryId":"cirurgia","level":"hard","question":"Em uma fratura aberta, qual aspecto altera a prioridade do manejo?","options":["Contaminação e comprometimento dos tecidos moles, além da estabilização do paciente","A cor da coleira","O comprimento do pelo","A raça isoladamente"],"correctIndex":0,"explanation":"Fraturas abertas exigem avaliação de ferida, contaminação, tecidos moles e estabilização sistêmica e ortopédica.","levelStatus":"editorial-triage"},{"id":"cirurgia-N30","categoryId":"cirurgia","level":"hard","question":"Por que o consentimento informado deve anteceder procedimento eletivo?","options":["Permite decisão esclarecida sobre riscos, benefícios e alternativas","Substitui prontuário","Garante ausência de complicações","Dispensa comunicação de custos"],"correctIndex":0,"explanation":"Consentimento é parte da relação ética e documenta que tutor compreendeu o procedimento e suas alternativas.","levelStatus":"editorial-triage"},{"id":"anestesia-N11","categoryId":"anestesia","level":"easy","question":"Qual variável é estimada pela oximetria de pulso?","options":["Saturação periférica de oxigênio da hemoglobina","Pressão arterial média diretamente","Concentração de glicose","Débito urinário"],"correctIndex":0,"explanation":"A SpO₂ é estimativa não invasiva da saturação; perfusão ruim e movimento podem afetar a leitura.","levelStatus":"editorial-triage"},{"id":"anestesia-N12","categoryId":"anestesia","level":"easy","question":"O que a capnografia mede ao longo do tempo?","options":["CO₂ expirado e sua curva respiratória","Temperatura central","Pressão venosa central","Concentração de hemoglobina"],"correctIndex":0,"explanation":"A curva capnográfica permite acompanhar EtCO₂ e padrão ventilatório durante anestesia.","levelStatus":"editorial-triage"},{"id":"anestesia-N13","categoryId":"anestesia","level":"easy","question":"Qual é a função principal de um opioide no protocolo anestésico?","options":["Analgesia","Antissepsia","Antibioticoterapia","Relaxamento de tendão por ação local"],"correctIndex":0,"explanation":"Opioides são usados principalmente para analgesia e podem reduzir necessidade de outros anestésicos.","levelStatus":"editorial-triage"},{"id":"anestesia-N14","categoryId":"anestesia","level":"easy","question":"Por que a pressão arterial deve ser monitorada durante anestesia?","options":["Hipotensão pode comprometer perfusão de órgãos","A pressão não muda com anestesia","Serve para medir glicemia","Substitui ECG e capnografia"],"correctIndex":0,"explanation":"Anestésicos podem alterar tônus vascular e débito cardíaco; pressão é parte da monitorização.","levelStatus":"editorial-triage"},{"id":"anestesia-N15","categoryId":"anestesia","level":"easy","question":"O que significa plano anestésico?","options":["Profundidade e efeitos clínicos da anestesia no paciente","Tempo de jejum","Apenas dose total administrada","Tipo de cirurgia"],"correctIndex":0,"explanation":"Plano é avaliado por sinais clínicos e resposta, não apenas pela quantidade de fármaco aplicada.","levelStatus":"editorial-triage"},{"id":"anestesia-N16","categoryId":"anestesia","level":"easy","question":"Qual equipamento permite administrar anestésico inalatório em concentração controlada?","options":["Vaporizador calibrado","Refratômetro","Otoscópio","Centrífuga"],"correctIndex":0,"explanation":"O vaporizador converte anestésico líquido em vapor e fornece concentração ajustável no circuito.","levelStatus":"editorial-triage"},{"id":"anestesia-N17","categoryId":"anestesia","level":"medium","question":"Durante anestesia, EtCO₂ aumenta progressivamente. Qual hipótese deve ser considerada?","options":["Hipoventilação, entre outras causas","Hipoglicemia confirmada","Hipotermia excluída","Hemorragia digestiva confirmada"],"correctIndex":0,"explanation":"A elevação pode refletir ventilação alveolar reduzida, aumento de produção de CO₂ ou problemas do circuito.","levelStatus":"editorial-triage"},{"id":"anestesia-N18","categoryId":"anestesia","level":"medium","question":"Qual é o risco de extubação precoce durante recuperação?","options":["Obstrução de via aérea se reflexos protetores ainda não retornaram","Aumento da densidade óssea","Infecção urinária imediata","Hiperglicemia obrigatória"],"correctIndex":0,"explanation":"A retirada do tubo deve considerar ventilação espontânea e retorno dos reflexos de proteção, conforme espécie e caso.","levelStatus":"editorial-triage"},{"id":"anestesia-N19","categoryId":"anestesia","level":"medium","question":"Por que a analgesia multimodal é utilizada?","options":["Combinar mecanismos diferentes para melhorar analgesia e reduzir dependência de um único fármaco","Somar fármacos sem avaliar interação","Eliminar toda monitorização","Substituir anestesia geral em qualquer cirurgia"],"correctIndex":0,"explanation":"Abordagens multimodais podem melhorar controle da dor com doses menores, respeitando contraindicações e interações.","levelStatus":"editorial-triage"},{"id":"anestesia-N20","categoryId":"anestesia","level":"medium","question":"Qual alteração pode ser causada por depressão respiratória induzida por anestésicos?","options":["Aumento de CO₂ e redução da ventilação","Aumento da produção de plaquetas","Hipertrofia cardíaca imediata","Aumento da densidade urinária"],"correctIndex":0,"explanation":"Depressão ventilatória reduz eliminação de CO₂ e pode causar hipercapnia e hipoxemia.","levelStatus":"editorial-triage"},{"id":"anestesia-N21","categoryId":"anestesia","level":"medium","question":"Qual é a principal limitação do ECG durante anestesia?","options":["Mostra atividade elétrica, mas não mede diretamente a força de contração ou perfusão","Não detecta frequência cardíaca","Mede diretamente oxigenação arterial","Substitui pressão arterial"],"correctIndex":0,"explanation":"ECG monitora ritmo e atividade elétrica; perfusão e pressão exigem outras medidas.","levelStatus":"editorial-triage"},{"id":"anestesia-N22","categoryId":"anestesia","level":"medium","question":"Um paciente anestesiado apresenta pressão baixa e pulso fraco. Qual raciocínio é apropriado?","options":["Investigar profundidade anestésica, volume circulante e função cardiovascular antes de intervir","Aumentar anestésico automaticamente","Ignorar se ECG estiver normal","Extubar imediatamente em todos os casos"],"correctIndex":0,"explanation":"Hipotensão tem causas distintas; a intervenção depende de avaliação integrada e resposta monitorada.","levelStatus":"editorial-triage"},{"id":"anestesia-N23","categoryId":"anestesia","level":"medium","question":"Por que a temperatura corporal é monitorada em procedimentos prolongados?","options":["Hipotermia é comum e pode alterar coagulação e metabolismo de fármacos","Temperatura não muda sob anestesia","Apenas febre importa","O termômetro mede oxigenação"],"correctIndex":0,"explanation":"Anestesia reduz termorregulação e perda de calor pode ser relevante, especialmente em pacientes pequenos.","levelStatus":"editorial-triage"},{"id":"anestesia-N24","categoryId":"anestesia","level":"hard","question":"Qual fator influencia a escolha de um protocolo anestésico?","options":["Espécie, idade, estado clínico, procedimento e recursos de monitorização","Apenas a cor da pelagem","Somente preferência do tutor","Apenas duração prevista"],"correctIndex":0,"explanation":"Protocolos devem ser individualizados com base em risco, objetivos e capacidade de monitorização.","levelStatus":"editorial-triage"},{"id":"anestesia-N25","categoryId":"anestesia","level":"hard","question":"Em paciente com doença respiratória, por que a pré-oxigenação pode ser útil, mas não elimina risco?","options":["Aumenta reserva de oxigênio, porém não corrige ventilação inadequada nem garante via aérea","Substitui ventilação em qualquer cenário","Impede toda dessaturação","Elimina necessidade de monitorar"],"correctIndex":0,"explanation":"Pré-oxigenação pode prolongar tempo até dessaturação, mas não corrige hipoventilação ou obstrução.","levelStatus":"editorial-triage"},{"id":"anestesia-N26","categoryId":"anestesia","level":"hard","question":"Qual é o objetivo de um bloqueio locorregional?","options":["Reduzir transmissão nociceptiva em território nervoso específico","Induzir inconsciência obrigatoriamente","Tratar infecção sistêmica","Aumentar metabolismo hepático"],"correctIndex":0,"explanation":"Bloqueios regionais fornecem analgesia em áreas específicas e podem reduzir necessidade de anestésicos sistêmicos.","levelStatus":"editorial-triage"},{"id":"anestesia-N27","categoryId":"anestesia","level":"hard","question":"Por que doses anestésicas não devem ser copiadas de outro animal apenas pelo peso?","options":["Resposta depende de espécie, fisiologia, comorbidades e fármacos associados","Peso não influencia dose","Todos os animais metabolizam igual","Dose é sempre fixa"],"correctIndex":0,"explanation":"Peso é apenas um dos fatores; avaliação individual e farmacologia são essenciais para segurança.","levelStatus":"editorial-triage"},{"id":"anestesia-N28","categoryId":"anestesia","level":"hard","question":"Durante anestesia, SpO₂ cai e a curva pletismográfica fica fraca. Qual fator pode interferir?","options":["Baixa perfusão periférica ou posicionamento inadequado do sensor","Aumento de albumina","Presença de parasitas intestinais","Excesso de cálcio"],"correctIndex":0,"explanation":"Oximetria pode falhar com vasoconstrição, hipotensão, movimento ou sensor mal posicionado.","levelStatus":"editorial-triage"},{"id":"anestesia-N29","categoryId":"anestesia","level":"hard","question":"Qual é a importância da avaliação pré-anestésica?","options":["Identificar riscos e adaptar o plano anestésico e monitorização","Garantir risco zero","Substituir exame físico durante recuperação","Definir apenas o jejum"],"correctIndex":0,"explanation":"A avaliação prévia identifica comorbidades e orienta exames, estabilização e escolha do protocolo.","levelStatus":"editorial-triage"},{"id":"anestesia-N30","categoryId":"anestesia","level":"hard","question":"Qual princípio deve orientar a alta após anestesia?","options":["Paciente deve apresentar recuperação adequada e critérios clínicos compatíveis com o caso","Alta depende apenas de abrir os olhos","Todo paciente recebe alta após tempo fixo","A alimentação imediata é obrigatória"],"correctIndex":0,"explanation":"Alta considera ventilação, temperatura, consciência, dor, mobilidade e risco específico.","levelStatus":"editorial-triage"},{"id":"diagnostico-N11","categoryId":"diagnostico","level":"easy","question":"Qual exame avalia a morfologia das células sanguíneas?","options":["Esfregaço sanguíneo","Ultrassom abdominal","Eletrocardiograma","Endoscopia"],"correctIndex":0,"explanation":"O esfregaço permite observar morfologia celular e pode revelar alterações que complementam contagens automatizadas.","levelStatus":"editorial-triage"},{"id":"diagnostico-N12","categoryId":"diagnostico","level":"easy","question":"O que é uma amostra hemolisada?","options":["Amostra em que houve ruptura de hemácias e liberação de conteúdo","Amostra sem plasma","Urina contaminada por fezes","Material com excesso de plaquetas apenas"],"correctIndex":0,"explanation":"Hemólise pode ocorrer na coleta ou no organismo e interferir em vários resultados laboratoriais.","levelStatus":"editorial-triage"},{"id":"diagnostico-N13","categoryId":"diagnostico","level":"easy","question":"Qual exame é usado para visualizar estruturas internas com ondas sonoras?","options":["Ultrassonografia","Tomografia por emissão de pósitrons","Eletroencefalograma","Densitometria"],"correctIndex":0,"explanation":"Ultrassom utiliza ondas sonoras e permite avaliação dinâmica de órgãos e tecidos moles.","levelStatus":"editorial-triage"},{"id":"diagnostico-N14","categoryId":"diagnostico","level":"easy","question":"O que representa a creatinina sérica?","options":["Marcador indireto relacionado à filtração renal","Medida direta de lesão hepática","Contagem de leucócitos","Concentração de cálcio ósseo"],"correctIndex":0,"explanation":"Creatinina ajuda a estimar função de filtração, mas sofre influência de massa muscular e deve ser contextualizada.","levelStatus":"editorial-triage"},{"id":"diagnostico-N15","categoryId":"diagnostico","level":"easy","question":"Qual é a finalidade de uma cultura bacteriana?","options":["Isolar microrganismos viáveis para identificação e, quando indicado, teste de sensibilidade","Visualizar fraturas","Medir pressão arterial","Contar hemácias"],"correctIndex":0,"explanation":"Cultura busca crescimento de microrganismos e pode orientar terapia antimicrobiana.","levelStatus":"editorial-triage"},{"id":"diagnostico-N16","categoryId":"diagnostico","level":"easy","question":"Por que a coleta de urina antes de antibióticos pode ser importante?","options":["Pode aumentar a chance de identificar o agente em cultura","Torna a urina estéril","Elimina necessidade de antibiograma","Confirma doença renal crônica"],"correctIndex":0,"explanation":"Antimicrobianos podem reduzir crescimento bacteriano e dificultar interpretação da cultura.","levelStatus":"editorial-triage"},{"id":"diagnostico-N17","categoryId":"diagnostico","level":"medium","question":"Um exame apresenta resultado fora do intervalo de referência, mas o animal está bem. Qual é a conduta interpretativa?","options":["Considerar variação biológica, método, histórico e repetir ou investigar se indicado","Assumir doença grave automaticamente","Ignorar todo resultado laboratorial","Tratar sem confirmação"],"correctIndex":0,"explanation":"Intervalos de referência não são limites absolutos; contexto clínico e magnitude da alteração importam.","levelStatus":"editorial-triage"},{"id":"diagnostico-N18","c
